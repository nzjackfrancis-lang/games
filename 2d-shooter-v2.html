function logDbg(msg) {

var cv = document.getElementById("game");
var gx = cv.getContext("2d");
var BASE_W = 960, BASE_H = 600, TAU = Math.PI * 2;

// W/H is the whole BLOCK (world units). VW/VH is the slice of it you can see.
// The camera follows you, so the streets slide past instead of you sliding
// around a static screen - that is what makes walking read as walking.
var W = 2400, H = 1600;
var VW = 960, VH = 600;                     // visible size, in world units
var SC = 1;                                // canvas pixels per world unit
var cam = { x: 0, y: 0 };
var DPR = 1;
var PIX = 1;                               // backing-store chunkiness (see fitCanvas)

// THE WHOLE GAME IS PIXELATED ON PURPOSE. The backing store is deliberately
// small (PIX divides the device resolution, targeting roughly 280 px tall) and
// CSS stretches it with image-rendering:pixelated, so every vector circle,
// gradient and glyph lands on the same chunky pixel grid as the 12x12 sprites.
// Want it crisper? raise the /288. Want it crunchier? lower it.
function fitCanvas() {
  var vw = window.innerWidth || BASE_W, vh = window.innerHeight || BASE_H;
  DPR = clamp(window.devicePixelRatio || 1, 1, 2);
  PIX = clamp(Math.round(vh * DPR / 288), 2, 6);
  var bw = Math.max(240, Math.round(vw * DPR / PIX)), bh = Math.max(160, Math.round(vh * DPR / PIX));
  cv.width = bw; cv.height = bh;
  cv.style.width = "100vw"; cv.style.height = "100vh";
  // Aim for 600 world units tall; very wide / very tall windows just see more
  // block rather than getting black bars.
  var want = clamp(BASE_H * (vw / vh), 700, 1560);
  SC = Math.max(bw / want, bh / BASE_H);
  VW = bw / SC; VH = bh / SC;
  gx.imageSmoothingEnabled = false;
}
function refit() {
  fitCanvas();
  updateCam(true);
  if (P) { pushOut(P, P.body); mouse.x = clamp(mouse.x, cam.x + 4, cam.x + VW - 4); mouse.y = clamp(mouse.y, cam.y + 4, cam.y + VH - 4); }
}
// Snap a world coordinate to a WHOLE backing-store pixel. With the low-res
// target the world runs at a fraction of a pixel per unit, so anything drawn
// at raw world coords lands between pixels and gets smeared by antialiasing.
// Sprites, the camera and text all pass through this first.
function qpx(v) { return Math.round(v * SC) / SC; }
addEventListener("resize", refit);

// world -> view (screen, in world units) for anything drawn as HUD
function vxA(x) { return x - cam.x; }
function vyA(y) { return y - cam.y; }
function onScreen(x, y, pad) {
  pad = pad || 0;
  return x > cam.x - pad && x < cam.x + VW + pad && y > cam.y - pad && y < cam.y + VH + pad;
}
function updateCam(snap) {
  if (!P) return;
  var tx = P.x - VW / 2, ty = P.y - VH / 2;
  // lean a little toward the reticle so you can see what you are aiming at
  tx += clamp((mouse.x - P.x) * 0.13, -VW * 0.14, VW * 0.14);
  ty += clamp((mouse.y - P.y) * 0.13, -VH * 0.14, VH * 0.14);
  tx = VW > W ? (W - VW) / 2 : clamp(tx, 0, W - VW);
  ty = VH > H ? (H - VH) / 2 : clamp(ty, 0, H - VH);
  var k = snap ? 1 : Math.min(1, 0.09 + dt_smooth * 2.4);
  cam.x += (tx - cam.x) * k;
  cam.y += (ty - cam.y) * k;
}

var SPR = {};
function mkSprite(rows) {
  var w = 0, h = rows.length, i, j;
  for (i = 0; i < h; i++) w = Math.max(w, rows[i].length);
  var a = document.createElement("canvas"); a.width = w; a.height = h;
  var b = document.createElement("canvas"); b.width = w; b.height = h;
  var x = a.getContext("2d"), y = b.getContext("2d");
  for (var r = 0; r < h; r++) for (i = 0; i < rows[r].length; i++) {
    var col = PAL[rows[r][i]];
    if (!col) continue;
    x.fillStyle = col; x.fillRect(i, r, 1, 1);          // normal
    y.fillStyle = "#ffffff"; y.fillRect(i, r, 1, 1);     // hit-flash variant
  }
  return { c: a, w: b, k: w / h };
}

// ---- walk cycles -------------------------------------------------------
// A sprite is either one frame (array of pixel rows) or a list of frames.
// Foes get their cycle generated from the base drawing: the bottom leg rows
// shuffle one pixel either way, which is the trick classic 16-bit games used
// to get walk cycles out of two or three drawings.
function shiftStr(s, d) {
  if (!d) return s;
  var pad = "......................";
  return d > 0 ? (pad.slice(0, d) + s).slice(0, s.length)
    : (s + pad.slice(0, -d)).slice(-s.length);
}
function legShuffle(rows, d, from) {
  var out = rows.slice(), i;
  for (i = from; i < out.length; i++) out[i] = shiftStr(out[i], d);
  return out;
}
function mkFrames(rows) {
  if (typeof rows[0] === "string") {                     // single drawing -> 4 frames
    var n = rows.length, lf = Math.max(2, Math.round(n * 0.28));
    rows = [rows, legShuffle(rows, 1, n - lf), rows, legShuffle(rows, -1, n - lf)];
  }
  var out = [], i;
  for (i = 0; i < rows.length; i++) out.push(mkSprite(rows[i]));
  return { f: out, n: out.length, k: out[0].k };
}
var WALK = [1, 2, 3, 2];                                 // step, pass, step, pass
function frameOf(ent, moving) {
  if (!moving) return 0;
  return WALK[Math.floor(ent.anim) % 4];
}
function buildSprites() {
  for (var n in ART) if (ART.hasOwnProperty(n)) SPR[n] = mkFrames(ART[n]);
  for (var m in ICONS) if (ICONS.hasOwnProperty(m)) SPR["ic_" + m] = mkFrames(ICONS[m]);
}

  };

// fr = animation frame (0 = standing)
function spr(name, x, y, size, ang, white, fr, flip) {
  var s = SPR[name]; if (!s) return;
  var f = s.f[(fr | 0) % s.n];
  // land the sprite on whole backing-store pixels (see qpx), otherwise the
  // low-res pass antialiases every sprite edge into grey porridge
  gx.save(); gx.translate(qpx(x), qpx(y));
  var psize = Math.max(1, Math.round(size * SC)) / SC;
  // `flip` mirrors the sprite about its own vertical axis. Bodies are drawn
  // UPRIGHT (ang = null) and turned left/right with this instead of being spun:
  // a head should never end up sideways because the boots went east.
  if (flip) gx.scale(-1, 1);
  if (ang !== null && ang !== undefined) gx.rotate(ang + Math.PI / 2);
  gx.drawImage(white ? f.w : f.c, -psize / 2, -psize / 2, psize, psize);
  gx.restore();
}
function icon(name, x, y, scale) {
  var s = SPR["ic_" + name]; if (!s) return;
  gx.drawImage(s.f[0].c, qpx(x), qpx(y), Math.max(1, Math.round(16 * scale * SC)) / SC, Math.max(1, Math.round(6 * scale * SC)) / SC);
}

// ---- the 2.5D toolkit ---------------------------------------------------
// Everything solid is drawn as a top face plus darker side faces hanging off
// the south and east edges: cheap extrusion, the same trick old isometric pixel
// games used, and it makes cabinets / crates / walls read as objects rather
// than as decals on the floor.
var DEPTH = 8;
function shade(hex, f) {
  var r = parseInt(hex.substr(1, 2), 16), g = parseInt(hex.substr(3, 2), 16), b = parseInt(hex.substr(5, 2), 16);
  r = clamp(Math.round(r * f), 0, 255); g = clamp(Math.round(g * f), 0, 255); b = clamp(Math.round(b * f), 0, 255);
  return "rgb(" + r + "," + g + "," + b + ")";
}
function shadowOval(x, y, rx, ry, a) {
  gx.fillStyle = "rgba(0,0,0," + (a || 0.42) + ")";
  gx.beginPath(); gx.ellipse(x, y, rx, ry, 0, 0, TAU); gx.fill();
}
function box3d(x, y, w, h, d, top, opt) {
  d = d || DEPTH;
  var front = (opt && opt.front) || shade(top, 0.52), side = (opt && opt.side) || shade(top, 0.34);
  shadowOval(x + w / 2 + d * 0.4, y + h + d * 0.3, w * 0.56, h * 0.2 + 2, 0.32);
  gx.fillStyle = front; gx.fillRect(x, y + h, w, d);                      // south face
  gx.fillStyle = side; gx.fillRect(x + w, y, d, h + d);                    // east face
  gx.fillStyle = shade(top, 0.66); gx.fillRect(x + w, y + h, d, d);         // corner post
  gx.fillStyle = top; gx.fillRect(x, y, w, h);                             // top face
  gx.fillStyle = "rgba(255,255,255,.10)"; gx.fillRect(x, y, w, 2);          // lit lip
  gx.fillStyle = "rgba(0,0,0,.20)"; gx.fillRect(x, y + h - 2, w, 2);
  if (opt && opt.lines) {
    gx.strokeStyle = "rgba(0,0,0,.32)"; gx.lineWidth = 1; gx.beginPath();
    var i;
    if (opt.lines === "v") for (i = x + 13; i < x + w - 2; i += 15) { gx.moveTo(i + 0.5, y + 2); gx.lineTo(i + 0.5, y + h - 2); }
    else for (i = y + 7; i < y + h - 2; i += 9) { gx.moveTo(x + 2, i + 0.5); gx.lineTo(x + w - 2, i + 0.5); }
    gx.stroke();
  }
}
// upright fuel drum: red body with a hazard band, steel lid, bung on top.
// Never rotates - a drum standing up does not spin with the ground, which is
// what made the old one look like a spinning waffle.
function drum3d(x, y, r, hot) {
  var bw = r, top = y - r * 0.55, bh = r * 1.15;
  shadowOval(x + 3, y + r * 0.62, r * 1.05, r * 0.5, 0.45);
  gx.fillStyle = "#4a1d18";
  gx.fillRect(x - bw, top, bw * 2, bh);
  gx.beginPath(); gx.ellipse(x, top + bh, bw, r * 0.42, 0, 0, TAU); gx.fill();
  gx.fillStyle = "rgba(0,0,0,.30)"; gx.fillRect(x - bw, top + bh * 0.30, bw * 2, 2);
  gx.fillStyle = "rgba(255,255,255,.07)"; gx.fillRect(x - bw, top + bh * 0.30 + 2, bw * 2, 1);
  gx.fillStyle = "rgba(0,0,0,.30)"; gx.fillRect(x - bw, top + bh * 0.62, bw * 2, 2);
  gx.fillStyle = "rgba(255,255,255,.07)"; gx.fillRect(x - bw, top + bh * 0.62 + 2, bw * 2, 1);
  gx.fillStyle = "rgba(217,182,79,.5)"; gx.fillRect(x - bw + 2, top + bh * 0.46, bw * 2 - 4, 3);
  gx.fillStyle = "rgba(0,0,0,.35)"; gx.fillRect(x + bw - 4, top, 4, bh);
  gx.fillStyle = hot > 0 && (timeNow * 22) % 2 > 1 ? "#ff8a4c" : "#8a3a30";
  gx.beginPath(); gx.ellipse(x, top, bw, r * 0.42, 0, 0, TAU); gx.fill();
  gx.fillStyle = "rgba(255,255,255,.14)";
  gx.beginPath(); gx.ellipse(x - bw * 0.25, top - 1, bw * 0.5, r * 0.18, 0, 0, TAU); gx.fill();
  gx.fillStyle = "#2b1a12";
  gx.beginPath(); gx.arc(x + bw * 0.45, top, r * 0.13, 0, TAU); gx.fill();
  if (hot > 0) {
    gx.strokeStyle = "rgba(255,138,76," + clamp(hot * 2, 0, 1) + ")"; gx.lineWidth = 2;
    gx.beginPath(); gx.ellipse(x, top + bh * 0.4, r + 4, r * 0.8 + 4, 0, 0, TAU); gx.stroke();
  }
}

// ============================================================ utils
// [Subsystem 0] Math + geometry helpers used everywhere. Owns nothing global.
// rnd, rndi, clamp, dist, pick, angDiff. See SYSTEMS.md §0.
function rnd(a, b) { return a + Math.random() * (b - a); }
function rndi(a, b) { return Math.floor(rnd(a, b + 1)); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function dist(ax, ay, bx, by) { return Math.hypot(bx - ax, by - ay); }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function angDiff(a, b) { var d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }

// ============================================================ audio
// [Subsystem 3a] WebAudio SFX. Owns ac, muted. Reads tone, burst, sfxShot.
// (3a, not 3: subsystem 3 is the world layout, which is what SYSTEMS.md says.)
// See SYSTEMS.md §3.
var ac = null, muted = false;
function audio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ac = null; } }
  if (ac && ac.state === "suspended") ac.resume();
}
function tone(freq, dur, type, vol, slide) {
  if (!ac || muted) return;
  var t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type || "square"; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(25, freq * slide), t + dur);
  g.gain.setValueAtTime(vol || 0.06, t);
  g.gain.exponentialRampToValueAtTime(0.0004, t + dur);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
}
function burst(dur, vol, cut, type) {              // noise based sfx (gunshot, flame, hit)
  if (!ac || muted) return;
  var n = Math.max(1, Math.floor(ac.sampleRate * dur));
  var buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
  for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, type === "tail" ? 1.4 : 2.6);
  var s = ac.createBufferSource(); s.buffer = buf;
  var f = ac.createBiquadFilter(); f.type = cut < 900 ? "lowpass" : "bandpass"; f.frequency.value = cut;
  var g = ac.createGain(); g.gain.value = vol || 0.1;
  s.connect(f); f.connect(g); g.connect(ac.destination); s.start();
}
var lastShot = 0;
function sfxShot(kind) {
  if (!ac || muted) return;
  if (ac.currentTime - lastShot < 0.018 && kind !== "flam" && kind !== "smg" && kind !== "lmg") return;
  lastShot = ac.currentTime;
  if (kind === "flint") { burst(0.22, 0.17, 900); tone(90, 0.16, "square", 0.06, 0.4); }
  else if (kind === "rev") { burst(0.11, 0.13, 1600); tone(240, 0.06, "square", 0.05, 0.4); }
  else if (kind === "gun") { burst(0.17, 0.16, 700); tone(120, 0.1, "square", 0.05, 0.4); }
  else if (kind === "ak") { burst(0.07, 0.1, 2000); tone(400, 0.04, "square", 0.035, 0.5); }
  else if (kind === "smg") { burst(0.05, 0.075, 2400); tone(520, 0.03, "square", 0.028, 0.5); }
  else if (kind === "lmg") { burst(0.08, 0.12, 1500); tone(300, 0.05, "square", 0.04, 0.5); }
  else if (kind === "sawn") { burst(0.13, 0.18, 600); tone(90, 0.1, "square", 0.06, 0.4); }
  else if (kind === "bolt") { burst(0.16, 0.17, 1100); tone(180, 0.12, "square", 0.05, 0.35); }
  else if (kind === "pot") { burst(0.2, 0.14, 420); tone(140, 0.18, "sine", 0.05, 0.5); }
  else if (kind === "flam") { burst(0.1, 0.05, 520, "tail"); }
  else { burst(0.05, 0.06, 3000); }
}

var BARREL_SLOTS = MAPS[0].slots;      // buildMap() repoints this at the live block

// ---- supply caches -------------------------------------------------------
// The only source of upgrades in the game. Waves do not hand out prizes any
// more: each block is seeded with teal field crates (and a brass vault or two)
// before the first crew walks in, and the quartermaster delivers a fresh one
// onto an emptied slot whenever the block runs dry. Positions are authored per
// map, because a cache is only worth hiding if it is somewhere you can see the
// sense in walking to - a back room, a yard, an alley, a roof-dark kiosk.
var chests = [], cacheSlots = [];
function addCache(x, y, big) {
  var c = { x: x, y: y, big: big ? 1 : 0, open: 0, pry: 0, t: rnd(0, 9), r: big ? 13 : 11 };
  chests.push(c); cacheSlots.push(c);
  return c;
}
// Anything solid within arm's reach of a crate makes it a crate nobody can
// open, so "can a body stand here" is checked against the walls AND the furniture.
function cacheSpotOK(x, y) {
  if (x < 22 || y < 22 || x > W - 22 || y > H - 22) return false;
  if (inWall(x, y, 15)) return false;
  for (var i = 0; i < props.length; i++) {
    var p = props[i];
    if (x > p.x - 13 && x < p.x + p.w + 13 && y > p.y - 13 && y < p.y + p.h + 13) return false;
  }
  return true;
}
// A crate authored on top of the counter it was meant to sit behind is a crate
// nobody reaches, so walk out from the authored point until the floor is clear.
function settleCache(c) {
  if (cacheSpotOK(c.x, c.y)) return true;
  var r, a;
  for (r = 16; r <= 110; r += 16) {
    for (a = 0; a < 10; a++) {
      var nx = c.x + Math.cos(a * TAU / 10 + r) * r, ny = c.y + Math.sin(a * TAU / 10 + r) * r;
      if (!cacheSpotOK(nx, ny)) continue;
      c.x = nx; c.y = ny; return true;
    }
  }
  return false;
}
function settleCaches() {
  for (var i = chests.length - 1; i >= 0; i--) if (!settleCache(chests[i])) chests.splice(i, 1);
  cacheSlots = chests.slice();          // only the crates that survived are delivery slots
}

// The live palette + sun for the block being drawn. buildMap() repoints it from
// MAPS[mapIdx], so the renderer can stay colour-blind about which map it is on.
var LP = MAPS[0].pal, LS = MAPS[0].light;

// Which block you are standing on. Everything below (walls, floors, roofs,
// props, lamps, crossings) is rebuilt from scratch, and the palette / sun angle
// come from the same entry, so a map and its lighting can never drift apart.
function buildMap() {
  var m = MAPS[mapIdx] || MAPS[0];
  W = m.w; H = m.h;
  LP = m.pal; LS = m.light;
  BARREL_SLOTS = m.slots;
  chests = []; cacheSlots = []; citySkips = 0;
  m.build();
  // windows along the sunny sides of every building: the glass you see from the
  // street, and the reason the floor just inside the wall is brighter.
  for (var i = 0; i < roofs.length; i++) roofWindows(roofs[i]);
  shopAt = { x: m.shop[0], y: m.shop[1] };
  padAt = { x: m.pad[0], y: m.pad[1] };
  clearDoorLanes();                   // nothing free-standing may stand in a doorway
  settleCaches();                     // and no cache may sit inside the furniture
  navBuild();                       // the crew needs to know where the walls are
}

// Windows are placed on the two sides the sun actually strikes (north and west),
// every ~52 units, skipping any stretch that has a doorway in it.
function roofWindows(ro) {
  ro.win = [];
  var step = 52, x, y, near;
  for (x = ro.x + 26; x < ro.x + ro.w - 20; x += step) {
    near = false;
    for (var d = 0; d < doors.length; d++) if (Math.abs(doors[d].x - x) < 40 && Math.abs(doors[d].y - ro.y) < 30) near = true;
    if (!near) ro.win.push({ x: x, y: ro.y + WT / 2, h: 1, dx: 0, dy: 1 });
  }
  for (y = ro.y + 26; y < ro.y + ro.h - 20; y += step) {
    near = false;
    for (var d2 = 0; d2 < doors.length; d2++) if (Math.abs(doors[d2].y - y) < 40 && Math.abs(doors[d2].x - ro.x) < 30) near = true;
    if (!near) ro.win.push({ x: ro.x + WT / 2, y: y, h: 0, dx: 1, dy: 0 });
  }
}

// Street lamps + hydrants on a grid, and crossings at the junctions. Anything
// that would land inside a wall is dropped rather than drawn through it.
function dressStreets(sx, sy, patches) {
  var px, py, k;
  for (px = sx * 0.6; px < W - 40; px += sx) {
    for (py = sy * 0.7; py < H - 40; py += sy) {
      if (!inWall(px, py, 26)) poles.push({ x: px, y: py, kind: "lamp" });
      if (!inWall(px + 70, py + 46, 22)) poles.push({ x: px + 70, y: py + 46, kind: "hydrant" });
      if (!inWall(px - 90, py + 40, 20) && !inWall(px + 90, py - 40, 20)) {
        for (k = 0; k < 5; k++) decals.push({ x: px - 30 + k * 34, y: py + 96, w: 20, h: 54, kind: "zebra" });
      }
    }
  }
  // lane dashes down the middle of the avenues the lamps stand on, so the open
  // ground reads as a road rather than a car park
  for (px = sx * 0.6; px < W - 40; px += sx) {
    for (py = 40; py < H - 40; py += 70) {
      if (!inWall(px - 45, py, 11) && !inWall(px - 23, py, 11)) decals.push({ x: px - 44, y: py, w: 20, h: 40, kind: "lane" });
    }
  }
  for (k = 0; k < patches; k++) {
    decals.push({ x: rnd(60, W - 100), y: rnd(60, H - 100), w: rnd(30, 90), h: rnd(24, 70), kind: "patch" });
  }
}

  // ---- the fifth row. Heights used to stop at a blank strip of tarmac at the

  //      houses with a street of their own in front of them, which is also the
  //      only place on this block with a garden wall to break a sightline.
  var brow = [80, 460, 840, 1220, 1600, 1980, 2260], bwd = [300, 260, 220, 300, 260, 220, 200];
  for (var bc = 0; bc < brow.length; bc++) {
    tryBuilding(brow[bc], 1880, bwd[bc], 220 + (bc % 2) * 20,
      { doors: [["n", 0.36 + (bc % 3) * 0.14], ["s", 0.5]], style: styles[(bc + 1) % styles.length], gap: 74 });
  }
  // ---- the caches. Every other doorway in the grid has one behind it, so the
  //      minimap is a hunt and not a wander; the crossroads ones are the cheap
  //      ones, out in the open where the sightlines meet; and the two brass
  //      vaults are at opposite corners of the estate, which is a whole diagonal
  //      of front doors to walk past on the way.
  for (var r2 = 0; r2 < rows.length; r2++) {
    for (var c2 = 0; c2 < cols.length; c2++) {
      if ((c2 + r2) % 2) continue;
      addCache(cols[c2] + 70 + ((c2 * 47) % 110), rows[r2] + 62 + ((r2 * 53) % 80),
        (c2 === 0 && r2 === 0) || (c2 === 4 && r2 === 3));
    }
  }
  for (var b2 = 0; b2 < brow.length; b2 += 2) addCache(brow[b2] + 60, 1950, b2 === 6);
  addCache(540, 470); addCache(1510, 470); addCache(2320, 470, 1);
  addCache(1020, 930); addCache(2000, 1360);
  addCache(300, 1360); addCache(1250, 1780); addCache(2200, 1780);
}


function inWall(x, y, pad) {
  pad = pad || 0;
  for (var i = 0; i < walls.length; i++) {
    var w = walls[i];
    if (x > w.x - pad && x < w.x + w.w + pad && y > w.y - pad && y < w.y + w.h + pad) return true;
  }
  return false;
}
function lineBlocked(x1, y1, x2, y2) {                 // sampled line-of-sight
  // One sample every ~18 units. A fixed 22 samples across a long sightline steps
  // straight over a 14-unit barrier, and a foe that believes it can see you every
  // other frame spends the fight changing its mind.
  var steps = clamp(Math.round(Math.hypot(x2 - x1, y2 - y1) / 18), 12, 90),
    dx = (x2 - x1) / steps, dy = (y2 - y1) / steps;
  for (var i = 1; i < steps; i++) {
    var px = x1 + dx * i, py = y1 + dy * i;
    if (inWall(px, py, 0)) return true;
    for (var b = 0; b < barrels.length; b++) if (dist(px, py, barrels[b].x, barrels[b].y) < barrels[b].r) return true;
  }
  return false;
}
function pushOut(o, r) {                               // circle vs wall rects
  for (var i = 0; i < walls.length; i++) {
    var w = walls[i];
    var nx = clamp(o.x, w.x, w.x + w.w), ny = clamp(o.y, w.y, w.y + w.h);
    var dx = o.x - nx, dy = o.y - ny, d2 = dx * dx + dy * dy;
    if (d2 > r * r) continue;
    if (d2 > 1e-6) {
      var d = Math.sqrt(d2); o.x = nx + dx / d * r; o.y = ny + dy / d * r;
    } else {                                            // centre inside the rect: pop to nearest edge
      var l = o.x - w.x, rr = w.x + w.w - o.x, t = o.y - w.y, bo = w.y + w.h - o.y, m = Math.min(l, rr, t, bo);
      if (m === l) o.x = w.x - r; else if (m === rr) o.x = w.x + w.w + r;
      else if (m === t) o.y = w.y - r; else o.y = w.y + w.h + r;
    }
  }
  for (var b = 0; b < barrels.length; b++) {
    var ba = barrels[b], ddx = o.x - ba.x, ddy = o.y - ba.y, dd = Math.hypot(ddx, ddy);
    if (dd < r + ba.r && dd > 0.001) { o.x = ba.x + ddx / dd * (r + ba.r); o.y = ba.y + ddy / dd * (r + ba.r); }
  }
  o.x = clamp(o.x, r, W - r); o.y = clamp(o.y, r, H - r);
}
function rectOf(idx) { return roofs[idx]; }
function inRect(r, x, y) { return x > r.x && x < r.x + r.w && y > r.y && y < r.y + r.h; }
function distToRect(r, x, y) {
  var dx = Math.max(r.x - x, 0, x - (r.x + r.w)), dy = Math.max(r.y - y, 0, y - (r.y + r.h));
  return Math.hypot(dx, dy);
}

// parts, shells, drops, turrets, barrels, mortars, score, wave, credits, combo…
// See SYSTEMS.md §5.
var keys = {}, mouse = { x: W / 2, y: H / 2, down: false };
var state = "menu";                     // menu | play | pause | dead | upgrade
var P, foes, bullets, ebul, parts, shells, drops, turrets, barrels;
var spawnList = [], spawnT = 0, waveT = 0, mortars = [], reinT = 0;
var score = 0, best = 0, wave = 0, kills = 0, credits = 0, combo = 1, comboT = 0;
var shake = 0, timeNow = 0, countT = 0, shots = 0, muteT = 0, bossRef = null;
var ebulFired = 0;                                            // rounds the crew has fired this run
// Small pieces of feedback live in the world now instead of across the middle

var shopOpen = false, uiRows = [], cards = [], hitFlash = 0, shopScroll = 0, SHOP_VIS = 9, shopSel = 0;
var shopBad = 0;                              // the shop flashed its price red a moment ago

function upL(id) { return P && P.up[id] ? P.up[id] : 0; }
function dmgMul() { return 1 + 0.15 * upL("dmg"); }
function rofMul() { return 1 + 0.12 * upL("rof"); }
function spdMul() { return 1 + 0.09 * upL("spd"); }
function rlMul() { return 1 / (1 + 0.20 * upL("rl")); }
function magOf(g) { return Math.max(1, Math.round((g.mag || 1) * (1 + 0.35 * upL("mag")))); }
function credMul() { return 1 + 0.25 * upL("cred") + 0.15 * upL("orz"); }
function grazeR() { return 14 + 6 * upL("orz"); }
function dashCd() { return 1.15 * Math.pow(0.75, upL("dash")); }
function turDmg() { return 1.7 * (1 + 0.35 * upL("tur")); }
function turRange() { return 270 * (1 + 0.15 * upL("tur")); }
function gun() { return GUNS[P.guns[P.gi]]; }
function curAmmoName() { return gun().ammo; }

function reset() {
  // Create the entity lists BEFORE buildMap(): buildMap() may rescale them to

  ebulFired = 0;

  buildMap();
  var st = (MAPS[mapIdx] || MAPS[0]).start;
  P = {
    x: st[0], y: st[1], body: 11, core: 4.5, a: -Math.PI / 2, vx: 0, vy: 0,

    anim: 0, moving: 0
  };
  reinT = 0; endless = false; pflash = 0; unlockedNew = [];
  var bpos = BARREL_SLOTS, i;

  score = 0; kills = 0; credits = 40; combo = 1; comboT = 0; wave = 0; shake = 0;

// ============================================================ input
// [Subsystem 6] Key/mouse/touch/wheel listeners. Routes into buy(), takeCard(),
// shopTabStep(), state transitions. Uses toCanvas() screen→world. See SYSTEMS.md §6.
addEventListener("keydown", function (e) {
  var k = (e.key || "").toLowerCase();
  keys[k] = true;
  if (k === " " || k === "tab" || k.indexOf("arrow") === 0) e.preventDefault();
  audio();
  if (k === "m") { muted = !muted; muteT = 1.3; if (!muted) tone(760, 0.07, "triangle", 0.04, 1.4); }
  if (state === "menu") {
    // the menu is a selector, not a text page: A/D picks the accent, W/S picks
    // the block, SPACE goes. Locked rows refuse to move and say why.
    if (k === " " || k === "enter") { reset(); state = "play"; }
    else if (k === "a" || k === "arrowleft") modeStep(-1);
    else if (k === "d" || k === "arrowright") modeStep(1);
    else if (k === "w" || k === "arrowup") mapStep(-1);
    else if (k === "s" || k === "arrowdown") mapStep(1);
    return;
  }
  if (state === "dead" || state === "won") {
    if (k === " " || k === "enter") {
      if (state === "won") { endless = true; state = "play"; }   // push on past the goal
      else { reset(); state = "play"; }
    } else if (k === "r") { reset(); state = "menu"; }
    return;
  }
  if (k === "p" || k === "escape") {
    if (shopOpen) { shopOpen = false; return; }
    if (state === "play") state = "pause"; else if (state === "pause") state = "play";
    return;
  }
  if (state === "upgrade") {
    var ui = parseInt(k, 10);
    if (ui >= 1 && ui <= cards.length) takeCard(ui - 1);
    return;
  }
  if (shopOpen) {
    if (k === "e" || k === "escape") { shopOpen = false; return; }
    if (k === "tab" || k === "q") { shopTabStep(e.shiftKey ? -1 : 1); return; }
    uiRows = shopRows();
    if (k === "arrowdown" || k === "s") shopSel = clamp(shopSel + 1, 0, uiRows.length - 1);
    else if (k === "arrowup" || k === "w") shopSel = clamp(shopSel - 1, 0, uiRows.length - 1);
    else if (k === "pagedown") shopSel = clamp(shopSel + SHOP_VIS, 0, uiRows.length - 1);
    else if (k === "pageup") shopSel = clamp(shopSel - SHOP_VIS, 0, uiRows.length - 1);
    else if (k === "enter") buy(uiRows[shopSel]);
    else {
      var si = parseInt(k, 10);
      if (si >= 1 && si <= SHOP_VIS) buy(uiRows[shopScroll + si - 1]);
    }
    shopKeep();
    tone(600, 0.02, "square", 0.015, 1.2);
    return;
  }
  if (state !== "play") return;
  var slot = GUN_KEYS.indexOf(k) + 1;
  if (slot > 0) {
    var want = GUN_ORDER[slot - 1];
    if (P.guns.indexOf(want) >= 0) { selectSlot(P.guns.indexOf(want)); }
    else tone(170, 0.07, "square", 0.03, 0.7);                    // not bought yet
  }
  if (k === "q") cycleGun(1);
  if (k === "r") startReload();
  if (k === "f") deployTurret();
  if (k === "e") { if (nearShop()) { shopOpen = !shopOpen; tone(880, 0.09, "triangle", 0.05, 1.3); } }
});
addEventListener("keyup", function (e) {
  var k = (e.key || "").toLowerCase();
  keys[k] = false;
  if (k === "shift") dashArmed = true;
});
addEventListener("blur", function () { if (state === "play") state = "pause"; keys = {}; mouse.down = false; });

function toCanvas(cx, cy) {
  var b = cv.getBoundingClientRect();
  // screen -> world: the view is a slice of the block, so add the camera back on
  return {
    x: cam.x + (cx - b.left) / (b.width || 1) * VW,
    y: cam.y + (cy - b.top) / (b.height || 1) * VH
  };
}
cv.addEventListener("mousemove", function (e) {
  var p = toCanvas(e.clientX, e.clientY);
  mouse.x = clamp(p.x, cam.x + 4, cam.x + VW - 4);                       // never lose the reticle
  mouse.y = clamp(p.y, cam.y + 4, cam.y + VH - 4);
  if (shopOpen) shopHover();
});
cv.addEventListener("mousedown", function (e) {
  if (e.button !== 0) return;
  audio();
  var p = toCanvas(e.clientX, e.clientY);
  if (state === "menu") {
    var vx = p.x - cam.x, vy = p.y - cam.y;
    for (var mi = 0; mi < menuHits.length; mi++) {
      var hb = menuHits[mi];
      if (vx > hb.x && vx < hb.x + hb.w && vy > hb.y && vy < hb.y + hb.h) { hb.f(); return; }
    }
    reset(); state = "play"; return;
  }
  if (state === "dead") { reset(); state = "play"; return; }
  if (state === "won") { endless = true; state = "play"; return; }
  if (state === "upgrade") {
    for (var i = 0; i < cards.length; i++) {
      var c = cards[i];
      var vx = p.x - cam.x, vy = p.y - cam.y;
      if (vx > c.x && vx < c.x + c.w && vy > c.y && vy < c.y + c.h) { takeCard(i); return; }
    }
    return;
  }
  if (shopOpen) {
    var tb = shopTabAt(p.x - cam.x, p.y - cam.y);
    if (tb >= 0 && tb !== shopTab) { shopTabStep(tb - shopTab); return; }
    var si = shopRowAt(p.x - cam.x, p.y - cam.y);
    if (si >= 0) { shopSel = si; buy(uiRows[si]); return; }
    if (!nearShop()) shopOpen = false;
    return;
  }
  mouse.down = true;
});
addEventListener("mouseup", function () { mouse.down = false; });
cv.addEventListener("contextmenu", function (e) { e.preventDefault(); });
// in a fight the wheel is a weapon selector; in the shop it scrolls the list
cv.addEventListener("wheel", function (e) {
  if (!shopOpen) {
    if (state === "play") { e.preventDefault(); cycleGun(e.deltaY > 0 ? 1 : -1); }
    return;
  }
  e.preventDefault();
  uiRows = shopRows();
  shopSel = clamp(shopSel + (e.deltaY > 0 ? 1 : -1), 0, uiRows.length - 1);
  shopKeep();
}, { passive: false });

var touch = null;
cv.addEventListener("touchstart", function (e) {
  e.preventDefault(); audio();
  if (state === "menu" || state === "dead" || state === "won") {
    var tp = toCanvas(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
    var vx = tp.x - cam.x, vy = tp.y - cam.y, mi;
    if (state === "menu") {
      for (mi = 0; mi < menuHits.length; mi++) {
        var hb = menuHits[mi];
        if (vx > hb.x && vx < hb.x + hb.w && vy > hb.y && vy < hb.y + hb.h) { hb.f(); return; }
      }
    }
    if (state === "won") { endless = true; state = "play"; return; }
    reset(); state = "play"; return;
  }
  var t = e.changedTouches[0], p = toCanvas(t.clientX, t.clientY); touch = p;
}, { passive: false });
cv.addEventListener("touchmove", function (e) {
  e.preventDefault();
  var t = e.changedTouches[0], p = toCanvas(t.clientX, t.clientY); touch = p;
}, { passive: false });
cv.addEventListener("touchend", function (e) { e.preventDefault(); touch = null; }, { passive: false });

// ============================================================ fx
// [Subsystem 7] Visual feedback. Owns parts, shells, shake, floaters. spark/boom/casing/say.
// See SYSTEMS.md §7.
function spark(x, y, n, col, spd) {
  for (var i = 0; i < n; i++) {
    var a = rnd(0, TAU), s = rnd(0.25, 1) * (spd || 210);
    parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rnd(0.16, 0.45), t: 0, r: rnd(1.2, 3), col: col });
  }
}
function boom(x, y, col, big) {
  spark(x, y, big ? 30 : 15, col, big ? 340 : 220);
  spark(x, y, big ? 14 : 7, "#eef4fb", big ? 170 : 120);
  if (big) { burst(0.4, 0.18, 600); shake = Math.min(22, shake + 11); }
  else { burst(0.14, 0.09, 1100); shake = Math.min(22, shake + 3.5); }
}
// A ring that expands out of a spot and is gone: a heal pulse, a summon, the
// Foreman changing phase. It reads as an event in the world rather than a word
// on the screen, which is the whole point.
var ripples = [];
function ripple(x, y, r, col) {
  ripples.push({ x: x, y: y, r: r, t: 0, life: 0.45, col: col || "#eef4fb" });
  while (ripples.length > 12) ripples.shift();
}
// Motes that fly the gap between the medic and whoever it just mended. The pulse
// ring says an event happened; these say who is being kept alive, and from where,
// which is the thing you actually route your shots around. They cross in about 0.4 s
// and die on arrival, so the line is never mistaken for a beam or a trinket.
function healMotes(x1, y1, x2, y2, n) {
  if (parts.length > 620) return;
  var a0 = Math.atan2(y2 - y1, x2 - x1), dd = dist(x1, y1, x2, y2), i;
  for (i = 0; i < n; i++) {
    var a = a0 + rnd(-0.15, 0.15), s = clamp(dd / 0.4, 70, 1200) * rnd(0.86, 1.1);
    parts.push({ x: x1, y: y1, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.4, t: 0, r: rnd(1.4, 2.6), col: "#7ef0b4" });
  }
}

// a line of feedback that belongs to a place, not to the screen
function say(txt, x, y, col) {
  floaters.push({ x: x, y: y, txt: txt, t: 0, life: 1.0, col: col || "#eef4fb" });
  while (floaters.length > 20) floaters.shift();
}
function casing(x, y, a) {
  shells.push({ x: x, y: y, vx: Math.cos(a + 1.6) * rnd(60, 130), vy: Math.sin(a + 1.6) * rnd(60, 130), t: 0, life: rnd(0.6, 1.1), a: rnd(0, TAU) });
}
// Footfall dust should be the street's own colour, not one hardcoded asphalt:
// the same boot skids grey dust on THE BLOCK and tan dust at BOW HEIGHTS.
function dustCol() {
  var mp = MAPS[mapIdx] || MAPS[0];
  try { return shade(mp.pal.walk, 0.8); } catch (e) { return "#454e59"; }
}

// ---- burning ground -----------------------------------------------------
// Fire that lands - a flinger pot that bursts, a drum that takes a round - leaves
// flame on the floor for a few seconds. It is painted UNDER the entities (§17),
// it ticks damage into whatever stands in it (§15 ticks it here, in §7, so the
// list stays owned by one subsystem), it dies of old age, and the list is capped.
//   numbers, and why: a tick is half a second and costs 30% of whatever set the
//   fire off, clamped to 2..6 - a pot's own 11 therefore burns for 3, which is
//   enough to finish a grunt that wanders in and stands there (hp ~4) but never
//   enough to delete a brute that only brushed past (24 hp eats six ticks). The
//   player pays half a foe's tick (so ~1-3 per half second) - the fire is a thing
//   you route around, not a thing that kills you for a mistake.
//   lifetime 2.9-3.7 s: long enough to read as territory, short enough that a
//   clear never smells like a minefield.
//   radius 60% of the blast, clamped 26..46, and the damage reach is 90% of that
//   plus a third of the body's radius - so standing 60 units from a pool is
//   always safe and the edge of the flame is honest.
var FIRE_MAX = 10;
var fires = [];
var fxBurnT = 0;                 // throttle for the "you are burning" floater
function fxFire(x, y, srcR, srcDmg) {
  var r = clamp(srcR * 0.6, 26, 46), dmg = clamp(Math.round((srcDmg || 10) * 0.3), 2, 6);
  // Fresh fire on ground that is already burning does not add a second pool: it
  // makes that patch younger, wider and hotter, which is what fire actually does.
  var at = -1;
  for (var i = 0; i < fires.length; i++) {
    if (dist(x, y, fires[i].x, fires[i].y) <= r * 0.7) { at = i; break; }
  }
  if (at >= 0) {
    var g = fires[at];
    g.t = 0; g.life = rnd(2.9, 3.7); g.dmg = Math.max(g.dmg, dmg);
    g.r = clamp(Math.max(g.r, r) + 4, 26, 46);
  } else {
    fires.push({ x: x, y: y, r: r, t: 0, life: rnd(2.9, 3.7), dmg: dmg, tk: 0, seed: rnd(0, TAU) });
    while (fires.length > FIRE_MAX) fires.shift();
    // it lights: a low whoomph under the blast, and the first thin smoke
    tone(rnd(58, 76), 0.55, "sawtooth", 0.035, 0.34);
    if (parts.length < 520) {
      for (var s = 0; s < 3; s++) {
        parts.push({ x: x + rnd(-r * 0.4, r * 0.4), y: y + rnd(-r * 0.25, r * 0.25), vx: rnd(-7, 7), vy: rnd(-30, -14), life: rnd(0.5, 0.95), t: 0, r: rnd(2, 4), col: "#6b7079" });
      }
    }
  }
}
// One tick of the burning ground. Everything that stands in it pays, you most
// gently of all; fire does not reach through a wall to get you.
function fxFireTick(dt) {
  fxBurnT = Math.max(0, fxBurnT - dt);
  for (var i = fires.length - 1; i >= 0; i--) {
    var g = fires[i];
    g.t += dt; g.tk += dt;
    if (g.t > g.life) { fires.splice(i, 1); continue; }
    // thin smoke off the top of the flame, a puff at a time, never a plume
    if (g.t > 0.25 && parts.length < 520 && Math.random() < dt * 5) {
      parts.push({ x: g.x + rnd(-g.r * 0.45, g.r * 0.45), y: g.y + rnd(-g.r * 0.22, g.r * 0.22), vx: rnd(-6, 6), vy: rnd(-26, -12), life: rnd(0.55, 1), t: 0, r: rnd(2.2, 4.2), col: "#767b84" });
    }
    if (g.tk < 0.5) continue;
    g.tk = 0;
    var fade = 1 - g.t / g.life;
    if (fade < 0.2) continue;                                  // embers do not burn
    for (var k = foes.length - 1; k >= 0; k--) {
      var f = foes[k], d = dist(g.x, g.y, f.x, f.y);
      if (d > g.r * 0.9 + f.r * 0.3) continue;
      if (d > g.r * 0.6 && lineBlocked(g.x, g.y, f.x, f.y)) continue;
      hurtFoe(k, g.dmg, 0, 0, 1);
      if (foes[k]) foes[k].burn = Math.max(foes[k].burn || 0, 0.6);
    }
    if (P && P.dashT <= 0 && dist(g.x, g.y, P.x, P.y) < g.r * 0.8 + P.core) {
      hurt(Math.max(1, Math.round(g.dmg * 0.5)), 1);
      if (fxBurnT <= 0) { say("on fire", P.x, P.y - 28, "#ff8a4c"); fxBurnT = 1.1; }
    }
  }
}
// The flame itself, drawn on the floor under everything: a scorched rim, a warm
// body, and five tongues that flicker on the clock so the patch never sits still.
function fxFireDraw() {
  for (var i = 0; i < fires.length; i++) {
    var g = fires[i];
    if (!onScreen(g.x, g.y, g.r + 40)) continue;
    var a = clamp(1 - g.t / g.life, 0, 1);
    var fl = 0.86 + 0.14 * Math.sin(timeNow * 11 + g.seed) + 0.06 * Math.sin(timeNow * 27 + g.seed * 2);
    gx.save();
    gx.globalAlpha = a * 0.42;
    gx.fillStyle = "#3a1a10";
    gx.beginPath(); gx.ellipse(g.x, g.y, g.r * 1.02, g.r * 0.62, 0, 0, TAU); gx.fill();
    gx.globalAlpha = a * 0.72 * fl;
    gx.fillStyle = "#c04a35";
    gx.beginPath(); gx.ellipse(g.x, g.y, g.r * 0.86 * fl, g.r * 0.5 * fl, 0, 0, TAU); gx.fill();
    gx.globalAlpha = a * 0.8 * fl;
    gx.fillStyle = "#ff8a4c";
    gx.beginPath(); gx.ellipse(g.x, g.y, g.r * 0.52 * fl, g.r * 0.3 * fl, 0, 0, TAU); gx.fill();
    // tongues: cheap, fixed at five, and they reach up the screen a little so the
    // patch reads as height and not as a painted roundel
    for (var t = 0; t < 5; t++) {
      var ph = g.seed + t * 1.257, wob = Math.sin(timeNow * (7 + t) + ph);
      var tx = g.x + Math.cos(ph * 2) * g.r * 0.5, ty = g.y + Math.sin(ph * 2) * g.r * 0.28;
      var tr = g.r * (0.14 + 0.08 * wob) * fl;
      gx.globalAlpha = a * (0.5 + 0.28 * wob);
      gx.fillStyle = t === 2 ? "#ffd678" : "#ff8a4c";
      gx.beginPath(); gx.ellipse(tx, ty - g.r * 0.12 * (0.5 + 0.5 * wob), tr, tr * 1.7, 0, 0, TAU); gx.fill();
    }
    gx.restore();
  }
}

// ============================================================ waves + upgrades
// [Subsystem 8] Wave economy + spawning. Owns spawnList, spawnT, waveT, reinT,
// mortars, bossRef. Enemies come off the camera ring. See SYSTEMS.md §8.
// Nothing here announces itself any more: the wave, the count and "hold to wave
// N" are all in the top bar, the Foreman arrives with a siren you hear and a
// health bar you see, and the rest is the off-screen pointers doing their job.
function startWave(n) {
  var md = MODES[modeIdx], mp = MAPS[mapIdx] || MAPS[0];
  wave = n; waveT = 0; reinT = 0; mortars = [];
  // the accent sets how hard and how many; the block itself adds a little more.
  // The extra crowd arrives gradually though - wave 1 is the same size on every
  // accent and the difference builds across the first four waves, so a harder
  // mode never opens by burying you before you have seen the layout.
  var ramp = Math.min(1, n / 4);
  var budget = Math.round((7 + n * 4.2) * (1 + (md.num * mp.num - 1) * ramp) + md.add * ramp), menu = [["grunt", 2]];
  if (n >= 2) menu.push(["runner", 3]);
  if (n >= 3) menu.push(["gunner", 5]);
  if (n >= 4) menu.push(["weaver", 5]);
  if (n >= 5) menu.push(["sapper", 6]);
  if (n >= 5) menu.push(["shield", 9]);
  if (n >= 6) menu.push(["burster", 7]);
  if (n >= 6) menu.push(["doc", 8]);
  if (n >= 7) menu.push(["spinner", 8]);
  if (n >= 7) menu.push(["flinger", 9]);
  if (n >= 8) menu.push(["sniper", 9]);
  if (n >= 4) menu.push(["brute", 12]);
  spawnList = [];
  var guard = 0;
  while (budget > 0 && guard++ < 500) {
    var opts = menu.filter(function (m) { return m[1] <= budget; });
    if (!opts.length) break;
    var c = pick(opts); spawnList.push(c[0]); budget -= c[1];
  }
  spawnT = 0.5;
  // restock the drums so cover does not run out over a long run
  var slots = BARREL_SLOTS;
  for (var sb = 0; sb < slots.length && barrels.length < 13; sb++) {
    var bx = slots[sb][0], by = slots[sb][1], free = !inWall(bx, by, 18) && !inDoorLane(bx, by, 14);
    for (var ob = 0; ob < barrels.length; ob++) if (dist(bx, by, barrels[ob].x, barrels[ob].y) < 48) free = false;
    if (free && dist(bx, by, P.x, P.y) > 70) barrels.push({ x: bx, y: by, r: 12, hp: 6, hot: 0 });
  }

  // The Foreman walks the block on the wave you are trying to hold, and then on
  // every fifth wave after that so an endless run keeps its peaks. One at a
  // time, and the siren is the only warning you get.
  if (!bossRef || foes.indexOf(bossRef) < 0) bossRef = null;
  if (!bossRef && ((!endless && n >= md.goal) || (endless && n % 5 === 0))) {
    bossRef = spawnFoe("boss");
    spawnT = Math.max(spawnT, 1.4);                        // let it arrive first
    tone(70, 1.5, "sawtooth", 0.07, 2.4); tone(105, 1.1, "sine", 0.05, 1.8);
  }
}
// One incoming shell, called by the Foreman's bombardment. The telegraph ring is
// the warning; the ring of shards it throws afterwards is the punishment.
function shellAt(sx, sy, sr) {
  mortars.push({ x: clamp(sx, 18, W - 18), y: clamp(sy, 18, H - 18), r: sr, t: 0, life: 1.05 });
  tone(90, 0.25, "sine", 0.05, 2.2);
}
// A wave that drags on gets ANSWERED, not shelled out of the sky. Stall with
// the crew still alive and the block sends reinforcements - off the same camera
// ring a wave arrives from, weighted to the wave you are on, so they walk at you
// through the streets and doorways like everybody else and the fight just gets
// bigger. Camping is a choice with a price you can see coming, not a roulette
// spin on a shell that falls through a roof.
function reinforce() {
  if (foes.length > 18) return;                       // never bury the screen
  var pool = ["grunt", "grunt", "runner"];
  if (wave >= 3) pool.push("gunner");
  if (wave >= 4) pool.push("weaver", "brute");
  if (wave >= 5) pool.push("sapper", "shield");
  if (wave >= 6) pool.push("burster", "doc");
  if (wave >= 7) pool.push("spinner", "flinger");
  if (wave >= 8) pool.push("sniper");
  var rf = spawnFoe(pick(pool));
  if (rf) spark(rf.x, rf.y, 10, rf.col, 150);         // a muzzle-flare of dust where they land
  tone(160, 0.3, "sawtooth", 0.05, 0.6);
}
function spawnFoe(kind, sx, sy) {
  var d = FOE[kind], x = sx, y = sy;
  if (x === undefined) {
    // Come in from just past the edge of the camera, not from the far side of
    // the block: they arrive off-screen but never take a minute walking in.
    var ring = Math.max(VW, VH) * 0.60 + 40;
    for (var tries = 0; tries < 44; tries++) {
      var a2 = rnd(0, TAU);
      x = clamp(P.x + Math.cos(a2) * ring, 24, W - 24);
      y = clamp(P.y + Math.sin(a2) * ring, 24, H - 24);
      if (!inWall(x, y, 24) && dist(x, y, P.x, P.y) > ring * 0.85) break;
    }
  }
  // every wave hits harder: more HP, more damage, a bit quicker. On top of that
  // the accent you picked (MODES) and the block you are holding (MAPS) scale the
  // same three numbers, so a harder mode is always 'more of this', never new.
  // HP climbs 17% a wave to wave 8 and half that afterwards - a long run should
  // get busier, not turn into a bullet-sponge simulation.
  var md = MODES[modeIdx], mp = MAPS[mapIdx] || MAPS[0];
  var hpGrow = wave <= 8 ? 0.17 * (wave - 1) : 1.19 + 0.09 * (wave - 8);
  var hpMul = (1 + hpGrow) * md.hp * mp.hp;
  var dmMul = Math.min(3.4, (1 + 0.13 * (wave - 1)) * md.dmg * mp.dmg);
  var spMul = Math.min(1.34, Math.min(1.30, 1 + 0.020 * wave) * md.sp);
  var el = !d.boss && wave >= 5 && Math.random() < Math.min(0.30, (0.035 + wave * 0.021) * (1 + 0.12 * modeIdx));
  var f = {
    kind: kind, x: x, y: y, a: 0, r: d.r * (el ? 1.16 : 1),
    sp: d.sp * rnd(0.94, 1.1) * spMul,
    dmg: d.dmg * dmMul * (el ? 1.22 : 1),
    hp: (d.hp + wave * d.hs) * hpMul * (el ? 2.1 : 1),
    cr: Math.round(d.cr * (el ? 2.2 : 1)), pts: d.pts * (el ? 2 : 1),
    spr: d.spr, col: d.col, elite: el, anim: rnd(0, 4), moving: 0,
    cd: rnd(0.6, 1.9), tele: 0, teleFn: null, queue: [], hitCd: 0, flash: 0,
    stuck: 0, side: Math.random() < 0.5 ? -1 : 1, sway: Math.random() < 0.5 ? -1 : 1,
    ang: rnd(0, TAU), burn: 0, entered: false, los: false, pathT: rnd(0, 0.2),
    // hvx/hvy = the heading it is actually walking, smoothed toward wherever the
    // nav field points (subsystem 14). Without it a foe teleports between two
    // equally good headings every frame and walks in a zig-zag.
    hvx: 0, hvy: 0, face: d.face || 0, kbr: d.kbr === undefined ? 1 : d.kbr,
    healT: rnd(1, 2.4), fuse: 0, phase: 1, charge: 0, chargeA: 0, boomR: d.boom || 0,
    onPath: false, doorAim: 0, pathX: 0, pathY: 0, gone: 0, didOpen: 0, mended: 0,
    slideT: 0, slideA: 0, slideD: 1e9, slideCd: 0, stallT: 0, nearD: 1e9, rings: 0,
    losT: rnd(0, 0.07), whisk: 0, whiskA: 0,
    // the cover pair (subsystem 14): a shield's gun, and a gun's shield
    protect: null, coveredBy: null, pairT: rnd(0, 0.45), pairFlash: 0, hold: 0, stepMul: 1, postT: 0
  };
  f.hpMax = f.hp;
  foes.push(f);
  if (d.boss) bossRef = f;                                    // the bar follows the boss, not the spawner
  if (el) tone(210, 0.18, "square", 0.04, 0.7);            // elites announce themselves by ear
  return f;
}
function openUpgrade(picks) {
  cardPicks = Math.max(1, picks || 1);
  cards = [];
  var pool = UPG.filter(function (u) { return upL(u.id) < u.max; });
  if (!pool.length) {
    // the rack is maxed out: the crate still pays, it just pays in lead
    credits += 140; refillAll(); P.hp = Math.min(P.max, P.hp + 25);
    say("every upgrade maxed   +$140", P.x, P.y - 26, "#d9b64f");
    tone(520, 0.2, "triangle", 0.05, 1.4);
    return;
  }
  state = "upgrade";
  var want = cardPicks > 1 ? 4 : 3, tries = 0;
  while (cards.length < want && tries++ < 200 && pool.length) {
    var u = pick(pool);
    if (cards.indexOf(u) < 0) cards.push(u);
  }
  if (!cards.length) { countT = 1.2; state = "play"; return; }
  // cards are laid out from their own count, so a vault's four fit as well as a
  // crate's three on a narrow screen
  var n = cards.length, gap = n > 3 ? 14 : 22;
  var cw = clamp(Math.floor((VW - 70 - gap * (n - 1)) / n), 150, 232);
  var x0 = (VW - (cw * n + gap * (n - 1))) / 2, y0 = 168;
  for (var i = 0; i < n; i++) { cards[i].x = x0 + i * (cw + gap); cards[i].y = y0; cards[i].w = cw; cards[i].h = 196; }
  tone(300, 0.25, "triangle", 0.05, 2.2);
}
function takeCard(i) {
  var u = cards[i]; if (!u) return;
  P.up[u.id] = (P.up[u.id] || 0) + 1;
  P.hp = Math.min(P.max, P.hp + 10);                   // a crate is a good excuse to breathe
  if (u.id === "hp") { P.max += 25; P.hp = Math.min(P.max, P.hp + 25); }
  if (u.id === "plate") P.plates++;
  if (u.id === "kit") P.kits++;
  if (u.id === "ammo") refillAll();
  cards = [];
  cardPicks--;
  tone(700, 0.12, "triangle", 0.05, 1.8);
  if (cardPicks > 0) {                       // a brass vault pays out twice
    openUpgrade(cardPicks);
    if (state === "upgrade") return;
    cardPicks = 0;
  }
  countT = 2.2; state = "play";
}
// Holding a block to its goal wave is how the next accent gets earned. This is
// the only place progress is written; everything else just reads prog.
function secureBlock() {
  var key = progKey(mapIdx, modeIdx), i, before = [];
  for (i = 0; i < MODES.length; i++) before.push(modeUnlocked(i));
  var mapBefore = [];
  for (i = 0; i < MAPS.length; i++) mapBefore.push(mapUnlocked(i));
  prog.clr[key] = true;
  if (score > (prog.best[key] || 0)) prog.best[key] = score;
  progSave();
  if (score > best) { best = score; try { localStorage.setItem("blockoutBest", String(best)); } catch (e) {} }
  unlockedNew = [];
  for (i = 0; i < MODES.length; i++) if (!before[i] && modeUnlocked(i)) unlockedNew.push(MODES[i].n + " mode");
  for (i = 0; i < MAPS.length; i++) if (!mapBefore[i] && mapUnlocked(i)) unlockedNew.push(MAPS[i].n);
  state = "won";
  tone(520, 0.5, "triangle", 0.06, 1.9);
}

function refillAll() {
  for (var i = 0; i < P.guns.length; i++) {
    var g = GUNS[P.guns[i]];
    if (g.melee) continue;
    P.res[P.guns[i]] = g.res;
    if ((P.mag[P.guns[i]] || 0) < magOf(g)) startReload(true);
  }
  tone(560, 0.14, "square", 0.04, 1.5);
}

// ============================================================ shop
// [Subsystem 9] Supply shop. Owns uiRows, shopOpen, shopSel, shopScroll, shopTab,
// SHOP_TABS. WEAPONS/AMMO/GEAR tabs + pick/buy navigation. See SYSTEMS.md §9.
function nearShop() { return dist(P.x, P.y, shopAt.x, shopAt.y) < 76; }
function ammoPrice(g) { return Math.max(20, Math.round(g.price * 0.22)); }
function shopAllRows() {
  var rows = [];
  function row(sec, label, price, kind, gid, note) {
    rows.push({ sec: sec, label: label, price: price, kind: kind, gid: gid, note: note });
  }
  for (var i = 0; i < GUN_ORDER.length; i++) {
    var id = GUN_ORDER[i], g = GUNS[id];
    if (P.guns.indexOf(id) >= 0) continue;
    row("WEAPONS", g.n.toUpperCase(), g.price, "gun", id,
      (g.melee ? "melee, no ammo · rate " : "dmg " + g.dmg + (g.pel > 1 ? " x" + g.pel : "") + " · mag " + (g.mag || "-") + " · " + (g.ammo || "-") + " · rate ") + (1 / g.cd).toFixed(1) + "/s");
  }
  for (var j = 0; j < P.guns.length; j++) {
    var id2 = P.guns[j], g2 = GUNS[id2];
    if (g2.melee) continue;
    row("AMMO", g2.ammo + " reserve", ammoPrice(g2), "ammo", id2,
      "fill reserve to " + g2.res + " (now " + (P.res[id2] || 0) + ")");
  }
  row("GEAR", "MEDKIT", 60, "med", null, "heal 50 HP now");
  row("GEAR", "ARMOR PLATE", 130, "armor", null, "+20 max HP and heal 20");
  row("GEAR", "TURRET KIT", 95, "kit", null, "deploy with F " + (P.kits > 0 ? "(have " + P.kits + ")" : ""));
  row("GEAR", "CERAMIC PLATE", 110, "plate", null, "spare plate eats one hit (have " + P.plates + ")");
  row("GEAR", "FIELD REPAIR", 150, "refill", null, "refill every magazine");
  return rows;
}
// The list is split into tabs - one 20-row wall of text is what made the old
// shop awkward to walk through with the keyboard.
var SHOP_TABS = ["WEAPONS", "AMMO", "GEAR"];
var shopTab = 0;
function shopCount(sec) {
  var n = 0, all = shopAllRows();
  for (var i = 0; i < all.length; i++) if (all[i].sec === sec) n++;
  return n;
}
function shopRows() {
  var out = [], all = shopAllRows();
  for (var i = 0; i < all.length; i++) if (all[i].sec === SHOP_TABS[shopTab]) out.push(all[i]);
  return out;
}
function shopTabStep(d) {
  shopTab = (shopTab + d + SHOP_TABS.length) % SHOP_TABS.length;
  uiRows = shopRows();
  shopSel = clamp(shopSel, 0, Math.max(0, uiRows.length - 1));
  shopScroll = 0; shopKeep();
  tone(700, 0.03, "square", 0.02, 1.3);
}
// keep the highlighted row inside the visible page
function shopKeep() {
  var vis = Math.min(SHOP_VIS, uiRows.length);
  if (shopSel < shopScroll) shopScroll = shopSel;
  else if (shopSel >= shopScroll + vis) shopScroll = shopSel - vis + 1;
  shopScroll = clamp(shopScroll, 0, Math.max(0, uiRows.length - vis));
}
// click / hover on a row selects it
function shopRowAt(px, py) {
  for (var i = 0; i < uiRows.length; i++) {
    var r = uiRows[i];
    if (r.w && px > r.x && px < r.x + r.w && py > r.y && py < r.y + r.h) return i;
  }
  return -1;
}
function shopHover() {
  var i = shopRowAt(mouse.x - cam.x, mouse.y - cam.y);
  if (i >= 0) { shopSel = i; shopKeep(); }
}
function buy(r) {
  if (!r) return;
  // every refusal is a tone plus the price going red in the list, not a banner
  if (credits < r.price) { tone(120, 0.15, "square", 0.05, 0.6); shopBad = 0.9; return; }
  if (r.kind === "ammo" && (P.res[r.gid] || 0) >= GUNS[r.gid].res) { tone(160, 0.1, "square", 0.04, 0.8); shopBad = 0.9; return; }
  if (r.kind === "med" && P.hp >= P.max) { tone(160, 0.1, "square", 0.04, 0.8); shopBad = 0.9; return; }
  credits -= r.price;
  var g = GUNS[r.gid];
  if (r.kind === "gun") {
    P.guns.push(r.gid);
    P.mag[r.gid] = magOf(g); P.res[r.gid] = g.res;
    selectSlot(P.guns.indexOf(r.gid));
    say(g.n, P.x, P.y - 26, "#d9b64f");                 // floats over your own head
  } else if (r.kind === "ammo") { P.res[r.gid] = g.res; say(g.ammo + " restocked", P.x, P.y - 26, "#9fb3c9"); }
  else if (r.kind === "med") { P.hp = Math.min(P.max, P.hp + 50); say("+50 HP", P.x, P.y - 26, "#69c07a"); }
  else if (r.kind === "armor") { P.max += 20; P.hp = Math.min(P.max, P.hp + 20); say("+20 armor", P.x, P.y - 26, "#aebbc9"); }
  else if (r.kind === "kit") { P.kits++; say("turret kit", P.x, P.y - 26, "#4fd6c8"); }
  else if (r.kind === "plate") { P.plates++; say("spare plate", P.x, P.y - 26, "#aebbc9"); }
  else if (r.kind === "refill") { refillAll(); say("magazines full", P.x, P.y - 26, "#9fb3c9"); }
  tone(880, 0.1, "triangle", 0.06, 1.5);

  shopSel = clamp(shopSel, 0, Math.max(0, uiRows.length - 1));
