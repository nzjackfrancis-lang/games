// ============================================================ weapons
// [Subsystem 10] Firing + reload. Owns lastShot. Pellets/spread/knockback from gun
// stats in subsystem 4. See SYSTEMS.md §10.
function startReload(instant) {
  var id = P.guns[P.gi], g = GUNS[id];
  if (g.melee || P.reloading > 0) return;
  if ((P.mag[id] || 0) >= magOf(g)) return;
  if ((P.res[id] || 0) <= 0) { tone(140, 0.07, "square", 0.04, 0.7); return; }
  P.reloadT = (instant ? 0.25 : g.rl) * rlMul();
  P.reloading = P.reloadT;
  tone(300, 0.06, "square", 0.03, 0.7);
  setTimeout(function () { tone(430, 0.05, "square", 0.03, 0.8); }, Math.min(700, P.reloadT * 500));
}
// Switching weapons lives here so the keys, the wheel, the shop and the HUD all
// agree on what it costs: the current reload is dropped and there is a short
// hand-down delay. That is the whole price of carrying a rack instead of a rifle.
function selectSlot(i) {
  if (i < 0 || i >= P.guns.length || i === P.gi) return;
  P.gi = i; P.reloading = 0; P.cd = Math.max(P.cd, 0.14);
  tone(520, 0.05, "square", 0.03, 1.4);
}
function cycleGun(d) {
  if (P.guns.length < 2) return;
  selectSlot((P.gi + d + P.guns.length) % P.guns.length);
}
function finishReload() {
  var id = P.guns[P.gi], g = GUNS[id];
  var need = magOf(g) - (P.mag[id] || 0), have = P.res[id] || 0;
  var take = Math.min(need, have);
  P.mag[id] = (P.mag[id] || 0) + take; P.res[id] = have - take;
}
function fire() {
  var g = gun(), id = P.guns[P.gi];
  if (g.melee) {
    P.cd = g.cd / rofMul(); P.swing = 0.16; P.kick = 1.1;
    tone(700, 0.05, "triangle", 0.03, 0.4); burst(0.06, 0.04, 4000);
    var hits = 0;
    for (var i = 0; i < foes.length; i++) {
      var f = foes[i], d = dist(P.x, P.y, f.x, f.y);
      if (d > g.range + f.r) continue;
      if (Math.abs(angDiff(Math.atan2(f.y - P.y, f.x - P.x), P.a)) > g.arc / 2) continue;
      hurtFoe(i, g.dmg * dmgMul(), Math.cos(P.a) * g.kb, Math.sin(P.a) * g.kb, 1);
      hits++;
    }
    if (hits) { shake = Math.min(22, shake + 2); spark(P.x + Math.cos(P.a) * 24, P.y + Math.sin(P.a) * 24, 6, "#c04a35", 160); }
    return;
  }
  if ((P.mag[id] || 0) <= 0) { startReload(); P.cd = 0.25; return; }
  P.mag[id]--;
  P.cd = g.cd / rofMul();
  // recoil: the gun slides back a couple of px and the flash gets one frame
  P.kick = Math.min(1.6, P.kick + (id === "flint" || id === "bolt" ? 1.5 : (id === "gun" || id === "sawn" || id === "pot") ? 1.3 : id === "rev" ? 0.8 : 0.5));
  shots++; sfxShot(id);
  var mx = P.x + Math.cos(P.a) * (P.body + 6), my = P.y + Math.sin(P.a) * (P.body + 6);
  for (var p = 0; p < (g.pel || 1); p++) {
    var a = P.a + rnd(-g.spread, g.spread);
    bullets.push({
      x: mx, y: my, vx: Math.cos(a) * g.spd, vy: Math.sin(a) * g.spd,
      dmg: g.dmg * dmgMul(),
      r: id === "flam" ? 7 : id === "pot" ? 5 : (id === "gun" || id === "sawn") ? 3.4 : 2.8,
      t: 0, life: g.life || (id === "ak" || id === "lmg" ? 0.55 : id === "pot" ? 1.3 : 0.9),
      col: id === "flam" ? "#ff8a4c" : id === "pot" ? "#ffd678" : "#ffe6a8",
      pierce: (g.pierce || 0) + upL("pie"), hit: [], burn: g.burn ? 2 : 0, kb: g.kb || 20,
      expl: g.expl || null                       // pots burst wherever they stop
    });
  }
  if (g.smoke || id === "pot") spark(mx, my, id === "pot" ? 10 : 6, "#9aa4ad", id === "pot" ? 120 : 90);
  spark(mx, my, 3, "#ffd9a0", 120);
  pflash = 0.07;                                        // your muzzle lights the room
  casing(P.x, P.y, P.a);
  shake = Math.min(22, shake + (id === "flint" ? 4 : id === "pot" ? 3.6 : id === "gun" ? 3.4 :
    id === "sawn" ? 4.2 : id === "bolt" ? 3.8 : id === "rev" ? 2 : id === "lmg" ? 1.2 : 0.9));
  if ((P.mag[id] || 0) === 0) startReload();
}

// ============================================================ foe damage / death
// [Subsystem 11] Damage application + death. hurtFoe/killFoe/dropAt apply HP,
// knockback, burns, adds, loot. See SYSTEMS.md §11.
function hurtFoe(i, dmg, kx, ky, silent) {
  var f = foes[i]; if (!f) return;
  f.hp -= dmg; f.flash = 0.08;
  f.x += kx * 0.006; f.y += ky * 0.006;
  pushOut(f, f.r);
  if (!silent) spark(f.x, f.y, 4, f.col, 140);
  if (f.hp <= 0) killFoe(i);
}
function killFoe(i) {
  var f = foes[i]; if (!f) return;
  boom(f.x, f.y, f.col, f.kind === "brute" || f.kind === "burster");
  kills++;
  comboT = 2.2; combo = Math.min(8, combo + 1);
  var pay = Math.round(f.cr * (1 + wave * 0.1) * credMul() * (1 + (combo - 1) * 0.12));
  credits += pay; score += Math.round(f.pts * combo);
  if (f.kind === "boss") {
    bossRef = null;
    boom(f.x, f.y, "#ffd678", true); boom(f.x, f.y, "#c04a35", true);
    shake = Math.min(22, shake + 16);
    ripple(f.x, f.y, 200, "#ffd678");
    for (var dg = 0; dg < 3; dg++) drops.push(dropAt(f.x + rnd(-26, 26), f.y + rnd(-26, 26), pick(["ammo", "med", "kit"])));
    tone(60, 1.2, "sawtooth", 0.08, 0.4);
  }
  if (f.kind === "sapper" && !f.gone) { f.gone = 1; explode(f.x, f.y, f.boomR || 76, f.dmg, 0); }
  // A pair is only a pair while both of them are standing. Drop the guard so the
  // shield comes back for you instead of planting itself in front of a corpse.
  if (f.coveredBy) { f.coveredBy.protect = null; f.coveredBy = null; }
  if (f.kind === "brute") {
    for (var j = 0; j < 2; j++) {
      var c = spawnFoe("gunner", f.x + rnd(-20, 20), f.y + rnd(-20, 20));
      c.hp = 2 + wave * 0.2; c.hpMax = c.hp; c.entered = true;
    }
  }
  if (Math.random() < 0.16) drops.push(dropAt(f.x, f.y, pick(["ammo", "ammo", "med", "med", "kit"])));
  foes.splice(i, 1);
}
// One explosion, whoever set it off: a firepot that stopped short, a sapper who
// got the hug he wanted, a drum that took a round. It damages foes with
// distance falloff, cooks off neighbouring drums, scorches the ground, and
// hurts you if you are standing where the firepot landed.
function explode(x, y, r, dmg, burn) {
  boom(x, y, "#ff8a4c", true);
  scorch.push({ x: x, y: y, r: r * 0.8, t: 0 });
  fxFire(x, y, r, dmg);                     // §7 glue: the blast leaves fire on the floor
  for (var i = foes.length - 1; i >= 0; i--) {
    var f = foes[i], d = dist(x, y, f.x, f.y);
    if (d > r + f.r) continue;
    hurtFoe(i, dmg * (1 - 0.6 * d / (r + f.r)), (f.x - x) * 7, (f.y - y) * 7, 1);
    if (burn && foes[i]) foes[i].burn = burn;
  }
  for (var b = 0; b < barrels.length; b++) {
    if (dist(x, y, barrels[b].x, barrels[b].y) < r + 42) {
      barrels[b].hp -= 6; if (barrels[b].hot <= 0) barrels[b].hot = 0.24;
    }
  }
  if (P.dashT <= 0 && dist(x, y, P.x, P.y) < r * 0.55 + P.core) hurt(Math.max(4, Math.round(dmg * 0.42)));
}
function dropAt(x, y, kind) {
  return { x: x, y: y, vx: rnd(-50, 50), vy: rnd(-50, 50), t: 0, kind: kind, a: rnd(0, TAU) };
}

// ============================================================ supply caches
// [Subsystem 11b] The upgrade economy. A closed crate is pried by standing in
// arm's reach of it, and a crate is the ONLY way an upgrade enters a run. Owns
// cardPicks, restockCache/openCache/tickCaches. See SYSTEMS.md §11b.
//
// Holding a wave used to pay in upgrades, which made the slow choice the fast
// one: you never had to go anywhere or risk anything, just survive the clock.
// Moving the prizes into the world means the reward is always somewhere, and
// getting to it is a decision with a price you can see coming.
var CACHE_R = 38, CACHE_PRY = 0.85, CACHE_VAULT_PRY = 1.3, cardPicks = 1;
function cachesLeft() { var n = 0, i; for (i = 0; i < chests.length; i++) if (!chests[i].open) n++; return n; }
// A quiet block gets a fresh delivery onto one of the slots that has already been
// emptied - and always a slot well away from wherever you are standing, so the
// delivery is a reason to cross the block rather than a present at your feet.
function restockCache() {
  if (cachesLeft() >= 2 || !cacheSlots.length) return;
  var cand = [], i;
  for (i = 0; i < cacheSlots.length; i++) {
    var c = cacheSlots[i];
    if (!c.open || dist(c.x, c.y, P.x, P.y) < 430) continue;
    cand.push(c);
  }
  if (!cand.length) return;
  var s = pick(cand);
  s.open = 0; s.pry = 0; s.big = wave >= 6 && Math.random() < 0.26 ? 1 : 0;
  settleCache(s);
  ripple(s.x, s.y, 96, s.big ? "#ffd678" : "#4fd6c8");
  spark(s.x, s.y, 12, s.big ? "#ffd678" : "#4fd6c8", 150);
  say(s.big ? "a brass vault came down" : "supplies came down", s.x, s.y - 20, s.big ? "#ffd678" : "#4fd6c8");
  tone(300, 0.2, "triangle", 0.05, 1.5);
}
function openCache(c) {
  c.open = 1; c.pry = 0;
  var i, loot = c.big ? ["ammo", "med", "kit", "kit"] : ["ammo", "med", "kit"];
  credits += c.big ? 90 : 35;
  for (i = 0; i < loot.length; i++) drops.push(dropAt(c.x + rnd(-22, 22), c.y + rnd(-22, 22), pick(loot)));
  boom(c.x, c.y, c.big ? "#ffd678" : "#4fd6c8", false);
  ripple(c.x, c.y, c.big ? 132 : 86, c.big ? "#ffd678" : "#4fd6c8");
  shake = Math.min(22, shake + (c.big ? 7 : 4));
  say(c.big ? "BRASS VAULT CRACKED   +$90" : "CACHE CRACKED   +$35", c.x, c.y - 22, c.big ? "#ffd678" : "#4fd6c8");
  tone(c.big ? 520 : 430, 0.3, "triangle", 0.06, c.big ? 1.9 : 1.5);
  openUpgrade(c.big ? 2 : 1);
}
// The pry itself: standing still within arm's reach is the whole cost, which is
// why a crate in the middle of the avenue is worth more than the one in the back
// room - the avenue one is in everybody's line of fire. Progress is the ring
// drawn round the box; let go and it bleeds back off.
function tickCaches(dt) {
  var i, c;
  for (i = 0; i < chests.length; i++) {
    c = chests[i]; c.t += dt;
    if (c.open) continue;
    if (dist(c.x, c.y, P.x, P.y) < CACHE_R + P.body) {
      c.pry += dt;
      if (Math.random() < dt * 10) spark(c.x, c.y - 5, 2, c.big ? "#ffd678" : "#4fd6c8", 80);
      if (c.pry >= (c.big ? CACHE_VAULT_PRY : CACHE_PRY)) { openCache(c); return true; }
    } else if (c.pry > 0) c.pry = Math.max(0, c.pry - dt * 2.2);
  }
  return false;
}
// The nearest closed crate, for the hint line and the pointer arrow.
function cacheNear(range) {
  var best = null, bd = range || 1e9, i;
  for (i = 0; i < chests.length; i++) {
    var c = chests[i];
    if (c.open) continue;
    var d = dist(c.x, c.y, P.x, P.y);
    if (d < bd) { bd = d; best = c; }
  }
  return best;
}

// ============================================================ turrets
// [Subsystem 12] Deployable turrets. Owns turrets. Track nearest foe, fire tracers.
// See SYSTEMS.md §12.
function deployTurret() {
  if (P.kits <= 0) { say("no kit - shop sells them", P.x, P.y - 26, "#c04a35"); tone(120, 0.14, "square", 0.05, 0.6); return; }
  if (turrets.length >= 3) { say("all slots active", P.x, P.y - 26, "#c04a35"); tone(140, 0.12, "square", 0.04, 0.7); return; }
  if (inWall(P.x, P.y, 18)) { say("no room here", P.x, P.y - 26, "#c04a35"); tone(140, 0.12, "square", 0.04, 0.7); return; }
  P.kits--;
  turrets.push({ x: P.x, y: P.y, hp: 70, max: 70, cd: 0, a: -Math.PI / 2, r: 13, flash: 0 });
  spark(P.x, P.y, 14, "#4fd6c8", 170);
  tone(520, 0.14, "square", 0.05, 1.6);
}

// ============================================================ player damage
// [Subsystem 13] Player health + plates. Owns hitFlash. Eats hits, breaks plates,
// handles death banner. See SYSTEMS.md §13.
function hurt(amount, silent) {
  if (P.dashT > 0) return;
  if (P.plates > 0) {
    P.plates--; spark(P.x, P.y, 16, "#aebbc9", 220); tone(1100, 0.12, "triangle", 0.06, 0.4);
    say("plate broken", P.x, P.y - 26, "#aebbc9");
    shake = Math.min(22, shake + 5); return;
  }
  P.hp -= amount; P.hurt = 0.3; hitFlash = 0.35;
  combo = 1; comboT = 0;
  if (!silent) { burst(0.12, 0.1, 500); shake = Math.min(22, shake + 6); spark(P.x, P.y, 9, "#c04a35", 200); }
  if (P.hp <= 0) {
    P.hp = 0; state = "dead"; shopOpen = false;
    boom(P.x, P.y, "#c04a35", true);
    if (score > best) { best = score; try { localStorage.setItem("blockoutBest", String(best)); } catch (e) {} }
  }
}

// ============================================================ foe behaviour
// [Subsystem 14] Enemy AI + steering. Owns NAV (the nav grid + flow field) and
// foeShove. foeThink decides each kind's firing pattern, foeMove decides where it
// walks. See SYSTEMS.md §14.
function eshot(e, a, spd, kind) {
  ebulFired++;
  if (ebul.length > 300) return;
  var wv = Math.min(1.35, 1 + 0.022 * wave);                    // later waves shoot quicker
  ebul.push({
    x: e.x + Math.cos(a) * (e.r + 3), y: e.y + Math.sin(a) * (e.r + 3),
    vx: Math.cos(a) * spd * wv, vy: Math.sin(a) * spd * wv, r: kind === "snipe" ? 4 : kind === "pot" ? 6 : 5,
    dmg: Math.round(e.dmg * (kind === "snipe" ? 1.2 : kind === "pot" ? 1 : 0.75)),
    t: 0, life: kind === "snipe" ? 1.1 : kind === "pot" ? 3.4 : 4.2,
    col: e.col, grazed: false, kind: kind || "n",
    fuse: kind === "pot" ? clamp(dist(P.x, P.y, e.x, e.y) / (spd * wv) - 0.04, 0.15, 1.6) : 0
  });
}
// A lobbed pot: aimed where you are standing, set to burst as it arrives rather
// than where it hits, which is what makes cover something you leave rather than
// something you hide in.
function epot(e) {
  ebulFired++;                                          // a lobbed pot counts as a round fired at you
  if (ebul.length > 300) return;
  var a = Math.atan2(P.y - e.y, P.x - e.x) + rnd(-0.05, 0.05);
  var spd = clamp(dist(P.x, P.y, e.x, e.y) / 1.05, 170, 430);
  ebul.push({
    x: e.x + Math.cos(a) * (e.r + 4), y: e.y + Math.sin(a) * (e.r + 4),
    vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, r: 6,
    dmg: Math.round(e.dmg), t: 0, life: 2.2, col: "#e0894a", grazed: false,
    kind: "pot", fuse: clamp(dist(P.x, P.y, e.x, e.y) / spd - 0.06, 0.2, 1.6)
  });
  tone(240, 0.09, "sine", 0.03, 1.8);
}
// A pot that goes off: a ring of shards, and fire where it landed.
function potBurst(x, y, dmg) {
  boom(x, y, "#e0894a", false);
  scorch.push({ x: x, y: y, r: 40, t: 0 });
  fxFire(x, y, 40, dmg);                    // §7 glue: a pot's fire pools where it landed
  for (var k = 0; k < 7; k++) {
    var a = k * TAU / 7 + rnd(-0.12, 0.12);
    ebul.push({ x: x, y: y, vx: Math.cos(a) * 215, vy: Math.sin(a) * 215, r: 4.5,
      dmg: Math.round(dmg * 0.55), t: 0, life: 2.6, col: "#e0894a", grazed: false, kind: "n", fuse: 0 });
  }
  if (P.dashT <= 0 && dist(x, y, P.x, P.y) < 34) hurt(Math.max(4, Math.round(dmg * 0.5)));
}
// A sapper that reached you. killFoe does the scoring; the blast is its own.
function detonate(e) {
  var i = foes.indexOf(e);
  if (i < 0 || e.gone) return;
  e.gone = 1;
  killFoe(i);
  explode(e.x, e.y, e.boomR || 76, e.dmg, 0);
}

// ---------------------------------------------------------------- the cover pair
// A riot plate is only worth what it is worth if there is something behind it.
// Alone, a shield is a fat melee foe you walk round; with a gun standing in its
// shadow it is a wall your bullets have to get around and the fight becomes an
// ORDERING problem - plate, then gun - which is the one puzzle the crew had no
// example of. This is not a new kind: it is the shield, `face` and `lineBlocked`
// pointed at each other.
//   The shield picks one shooter it could plausibly stand in front of, walks to
//   the spot on the line between you and them that actually covers them, and
//   plants. Only one shield per gun (o.coveredBy), and only while it can see you:
//   out of sight the nav field owns it and its job is to find you, not to guard
//   a corner you are not standing in front of.
var PAIRABLE = { gunner: 1, sniper: 1, weaver: 1, flinger: 1, doc: 1 };
var PAIR_RANGE = 380;       // how far off a shield will go to find a gun
var PAIR_MIN_D = 150;       // closer than this and it is a melee foe, not a wall
var _anchor = { x: 0, y: 0, d: 0 };
// The spot that covers a gun: dead on the line from you to them, one body width
// in front of their chest. Nudging that off the line so the gun could fire "past"
// its own cover was the first attempt, and it is wrong twice over: a plate that
// does not cover the line is not covering the gun, and a shield that steps back
// and forth across the lane its own gunner is firing down just lets your rounds
// through the gap it makes - measured, four of six rounds reached the gun with an
// 8-unit offset and a 12-unit shuffle on a 14-unit body. So the plate sits ON the
// line, the gun fires through its own cover, and the read is the one the pair
// needs: the wall is the problem, not the man behind it.
function pairAnchor(e, o, out) {
  var gdx = o.x - P.x, gdy = o.y - P.y, gd = Math.hypot(gdx, gdy) || 1;
  var ux = gdx / gd, uy = gdy / gd, stand = o.r + e.r + 12;
  out.x = o.x - ux * stand;
  out.y = o.y - uy * stand;
  out.d = gd - stand;                              // how far down that line the post sits
  return out;
}
function foePair(e, dt) {
  if (e.kind !== "shield") return;
  var o = e.protect, i;
  // A partner that is dead, detonated or no longer in the list is not worth
  // standing in front of. Checked here rather than in killFoe alone, because a
  // blast can empty the array from anywhere and foes.indexOf is the only honest
  // answer to "is this object still in the fight".
  if (o && (o.hp <= 0 || o.gone || o.coveredBy !== e || foes.indexOf(o) < 0)) {
    if (o && o.coveredBy === e) o.coveredBy = null;
    e.protect = null;
  }
  e.pairT -= dt;
  if (e.pairT > 0 || e.protect) return;
  e.pairT = 0.45;
  // A shield that cannot see you is on its way to you, and that is the right answer:
  // planting a plate in a street you are not standing at the end of is furniture.
  if (!e.los) return;
  var dMe = dist(P.x, P.y, e.x, e.y), best = null, bestV = 1e9;
  // And so is this: inside PAIR_MIN_D the shield is a thing you are hitting, and it
  // should behave like one. A plate that backs off 200 units to guard somebody
  // else's firefight the moment you get in its face is a comedy beat, and it
  // disarms the one hostile that already has its fists on you. Stepping OUT to a
  // post that is further away is fine - that is a shield taking cover, not fleeing.
  if (dMe < PAIR_MIN_D) return;
  for (i = 0; i < foes.length; i++) {
    o = foes[i];
    if (o === e || o.gone || o.hp <= 0 || !PAIRABLE[o.kind] || o.coveredBy) continue;
    var dGun = dist(P.x, P.y, o.x, o.y);
    // It has to have something to BLOCK. If the gun is nearer to you than the
    // plate is, the shield would be volunteering to stand in the open.
    if (dGun < dMe + o.r || dGun > 900) continue;
    var dPair = dist(e.x, e.y, o.x, o.y);
    if (dPair > PAIR_RANGE) continue;
    // The nearest gun that is roughly where I was already going. A shield that
    // turns about to guard a sniper three streets behind it stops being a threat
    // and starts being a joke.
    var v = dPair + Math.abs(angDiff(Math.atan2(o.y - e.y, o.x - e.x),
      Math.atan2(P.y - e.y, P.x - e.x))) * 120;
    if (v < bestV) { bestV = v; best = o; }
  }
  if (best) {
    e.protect = best; best.coveredBy = e; e.pairFlash = 0.8;
    ripple(e.x, e.y, 40, "#aebbc9");
    tone(300, 0.14, "square", 0.03, 1.2);
  }
}

// ---------------------------------------------------------------- the crew
function foeThink(e, dt) {
  var d = dist(P.x, P.y, e.x, e.y);
  var los = e.los;
  var aim = Math.atan2(P.y - e.y, P.x - e.x);
  var i;
  for (i = e.queue.length - 1; i >= 0; i--) {
    e.queue[i].t -= dt;
    if (e.queue[i].t <= 0) { eshot(e, e.queue[i].a, e.queue[i].s, e.queue[i].k); e.queue.splice(i, 1); }
  }
  var was = e.tele;
  e.tele = Math.max(0, e.tele - dt);
  if (was > 0 && e.tele <= 0 && e.teleFn) { e.teleFn(); e.teleFn = null; }
  e.cd -= dt;

  if (e.kind === "grunt" || e.kind === "runner" || e.kind === "brute" || e.kind === "shield") {
    if (e.kind === "brute" && e.hp < e.hpMax * 0.5 && e.cd <= 0) {
      e.cd = 2.3; e.tele = 0.45;
      e.teleFn = function () {
        for (var q = -8; q <= 7; q++) { if (q >= -1 && q <= 1) continue; e.queue.push({ t: 0, a: aim + q * TAU / 16, s: 200 }); }
        burst(0.2, 0.1, 800);
      };
    }
    return;                                                    // four kinds that just walk at you
  }

  if (e.kind === "sapper") {
    // It does not shoot. It gets inside arm's length, lights the fuse and gives
    // you about a third of a second to be somewhere else. Kill it at range.
    if (e.fuse <= 0 && d < 54) {
      e.fuse = 0.36; tone(1500, 0.1, "triangle", 0.05, 0.5);
    }
    if (e.fuse > 0) {
      e.fuse -= dt;
      e.flash = 0.06;
      if (Math.random() < 0.6) spark(e.x, e.y - 8, 1, "#ffd678", 40);
      if (e.fuse <= 0) { detonate(e); }
    }
    return;
  }

  if (e.kind === "doc") {
    // Mends whatever is standing near it, so it arrives behind the armour and
    // you have to reach it through them. Ignore it and the fight never ends.
    e.healT -= dt;
    if (e.healT <= 0) {
      e.healT = 2.6;
      var did = 0, gave = 0;
      for (i = 0; i < foes.length; i++) {
        var o = foes[i];
        if (o === e || o.hp >= o.hpMax || dist(e.x, e.y, o.x, o.y) > 152) continue;
        var was = o.hp;
        o.hp = Math.min(o.hpMax, o.hp + o.hpMax * 0.16);
        gave += o.hp - was;
        healMotes(e.x, e.y, o.x, o.y, 4);
        o.mended = 1.1;                                  // a beat of "this one, by them"
        spark(o.x, o.y, 5, "#c9c2a8", 70); did++;
      }
      if (did) {
        ripple(e.x, e.y, 152, "#c9c2a8"); tone(560, 0.14, "triangle", 0.04, 1.4);
        // Not "a medic is here" - you worked that out from the first wave. How much
        // it has already handed back is the number that makes you go around the
        // armour to reach it, so the medic keeps score of its own work. Twenty-five
        // points is roughly a brute's whole bar, or four grunts: the unit has to be
        // small because the CREW is small, a 60-point threshold never fired once.
        e.healed = (e.healed || 0) + gave;
        if (e.healed >= 25) { e.healed = 0; say("+25 HP BACK", e.x, e.y - e.r - 14, "#7ef0b4"); }
      }
    }
    if (los && e.cd <= 0 && d < 430) {
      e.cd = rnd(1.2, 1.7); eshot(e, aim + rnd(-0.14, 0.14), 250);
      tone(430, 0.04, "square", 0.02, 0.7);
    }
    return;
  }

  if (e.kind === "gunner") {
    if (los && e.cd <= 0 && d < 560) {
      e.cd = rnd(1.5, 2.4); e.tele = 0.3;
      e.teleFn = function () {
        for (var q = 0; q < 3; q++) e.queue.push({ t: q * 0.1, a: aim + rnd(-0.06, 0.06), s: 235 });
        tone(300, 0.06, "square", 0.03, 0.6);
      };
    }
    return;
  }
  if (e.kind === "weaver") {
    if (los && e.cd <= 0 && d < 460) { e.cd = rnd(0.5, 0.85); eshot(e, aim + rnd(-0.1, 0.1), 275); tone(420, 0.04, "square", 0.025, 0.7); }
    return;
  }
  if (e.kind === "flinger") {
    // Lobs pots at the ground you are standing on. Slow, telegraphed, and it
    // does not care whether you are behind a car.
    if (e.cd <= 0 && d > 130) {
      e.cd = rnd(2.4, 3.2); e.tele = 0.6;
      e.teleFn = function () { epot(e); if (wave > 7) e.queue.push({ t: 0.4, a: aim, s: 235 }); };
    }
    return;
  }
  if (e.kind === "spinner") {
    if (e.cd <= 0) {
      e.cd = 0.11; e.ang += 0.4;
      for (var arm = 0; arm < 3; arm++) eshot(e, e.ang + arm * TAU / 3, 155);
    }
    return;
  }
  if (e.kind === "burster") {
    if (e.cd <= 0) {
      e.cd = 2.5; e.tele = 0.5;
      e.teleFn = function () {
        for (var q = -9; q <= 8; q++) { if (q >= -2 && q <= 2) continue; e.queue.push({ t: (q + 9) * 0.02, a: aim + q * TAU / 18, s: 190 }); }
        burst(0.22, 0.09, 900);
      };
    }
    return;
  }
  if (e.kind === "sniper") {
    if (los && e.cd <= 0 && d > 200) {
      e.cd = 2.9; e.tele = 0.9;
      var lock = aim;
      e.teleFn = function () { eshot(e, lock, 780, "snipe"); burst(0.14, 0.1, 2400); };
      e.snipeA = lock;
    }
    return;
  }
  if (e.kind === "boss") { foeBoss(e, dt, d, los, aim); return; }
}

// ---------------------------------------------------------------- THE FOREMAN
// Four tricks and three phases. It does not shoot bullets at you from across the
// map - it herds: sweep the street, shell the corner you hid behind, call in the
// crew to make you step out, and then charge the square you just stepped into.
// Each phase drop shortens the gaps between all four.
function foeBoss(e, dt, d, los, aim) {
  var ph = e.hp < e.hpMax / 3 ? 3 : e.hp < e.hpMax * 0.66 ? 2 : 1;
  if (ph !== e.phase) {
    e.phase = ph; e.cd = 0.35; e.flash = 0.45;
    boom(e.x, e.y, "#ffd678", true);
    shake = Math.min(22, shake + 9);
    tone(ph === 3 ? 60 : 80, 0.8, "sawtooth", 0.07, 2.2);
    if (ph === 2) for (var s = 0; s < 14; s++) {
      var sa = s * TAU / 14;
      eshot(e, sa, 190);
    }
  }
  if (e.charge > 0) return;                                   // the charge is walking itself in foeMove
  if (e.cd > 0 || e.tele > 0) return;

  var fast = 1 - 0.18 * (ph - 1);                             // phase 3 is doing everything 60% faster
  var r = Math.random();
  var dd = dist(P.x, P.y, e.x, e.y);                           // NOT d: d is the foe definition

  // ENTRANCE. The first thing the Foreman ever does is put three craters on the
  // ground you are standing on, wherever that is - it knows where you are, that is
  // the suggestion. It also guarantees the shell attack is actually seen: the boss
  // moves at 78 units a second and its opening cooldown runs 0.6-1.9 s, so a range
  // gate alone meant it had always walked inside 430 before it first chose anything.
  if (!e.didOpen) {
    e.didOpen = 1; e.cd = 1.1; e.tele = 0.45;
    e.teleFn = function () {
      shellAt(P.x + rnd(-50, 50), P.y + rnd(-50, 50), rnd(72, 94));
      shellAt(P.x + rnd(-170, 170), P.y + rnd(-170, 170), rnd(62, 86));
      shellAt(P.x + rnd(-260, 260), P.y + rnd(-260, 260), rnd(58, 78));
      burst(0.3, 0.16, 620);
    };
    return;
  }

  if (dd > 300 && r < 0.34) {
    // SHells: three craters where you have been standing recently
    e.cd = 3.4 * fast; e.tele = 0.5;
    e.teleFn = function () {
      shellAt(P.x + rnd(-40, 40), P.y + rnd(-40, 40), rnd(70, 92));
      shellAt(P.x + rnd(-190, 190), P.y + rnd(-190, 190), rnd(60, 84));
      shellAt(e.x + rnd(-70, 70), e.y + rnd(-70, 70), rnd(60, 80));
    };
    return;
  }
  if (dd < 300 && r < 0.55) {
    // CHARGE: brace for it. Telegraph, then a straight line at three times speed.
    e.cd = (4.2 * fast); e.tele = 0.55; e.chargeA = aim;
    e.teleFn = function () {
      e.charge = 0.72;
      burst(0.25, 0.13, 500); tone(120, 0.3, "sawtooth", 0.06, 0.5);
    };
    return;
  }
  if (r < 0.72) {
    // SWEEP: a spray that walks across the street. You can see the arc it covers.
    e.cd = 2.6 * fast; e.tele = 0.45;
    e.teleFn = function () {
      var n = ph >= 3 ? 13 : ph >= 2 ? 10 : 7, sp = ph >= 3 ? 265 : 225;
      for (var q = 0; q < n; q++) e.queue.push({ t: q * 0.075, a: aim + (q - (n - 1) / 2) * 0.085, s: sp, k: "n" });
      burst(0.24, 0.12, 700);
    };
    return;
  }
  // CALL: the crew arrives, which is the part that actually kills you
  e.cd = 5 * fast; e.tele = 0.6;
  e.teleFn = function () {
    var n = ph >= 3 ? 3 : 2, i;
    for (i = 0; i < n; i++) {
      var a = rnd(0, TAU), rr = e.r + 34;
      var c = spawnFoe(ph >= 3 && Math.random() < 0.5 ? "shield" : "gunner", e.x + Math.cos(a) * rr, e.y + Math.sin(a) * rr);
      c.entered = true;
      spark(c.x, c.y, 10, c.col, 150);
    }
    ripple(e.x, e.y, 120, "#ffd678");
    tone(320, 0.3, "square", 0.05, 0.7);
  };
}

// ---------------------------------------------------------------- movement
// Where a foe walks, in four layers: what this kind of foe wants (hold range,
// weave, charge), what the nav field says when it cannot see you, a slide along
// whatever it has just walked into, and smoothing over all of the above so it
// does not stutter between two headings of equal merit.
function foeMove(e, dt) {
  var dx = P.x - e.x, dy = P.y - e.y, d = Math.hypot(dx, dy) || 1;
  var ux = dx / d, uy = dy / d, aim = Math.atan2(dy, dx);
  var vx = ux, vy = uy;

  if (e.charge > 0) {                                         // nothing redirects a charge
    e.charge -= dt;
    e.x += Math.cos(e.chargeA) * e.sp * 3.3 * dt;
    e.y += Math.sin(e.chargeA) * e.sp * 3.3 * dt;
    pushOut(e, e.r);
    e.a = e.chargeA; e.moving = 1; e.anim += dt * 12;
    if (Math.random() < 0.6) parts.push({ x: e.x - Math.cos(e.chargeA) * e.r, y: e.y - Math.sin(e.chargeA) * e.r,
      vx: rnd(-30, 30), vy: rnd(-30, 30), life: 0.3, t: 0, r: rnd(1.5, 3.5), col: "#69758a" });
    return;
  }

  e.hold = 0; e.stepMul = 1;
  // A pair is held together by the GUN's sight of you, not the shield's. The plate
  // exists to cover somebody who is still shooting, and if a parked van puts itself
  // between you and the shield for a second, abandoning the post and walking back
  // at you is how a guarded gun ends up with two foes tripping over each other.
  // postT is the grace period on that, and it is what the measured oscillation was:
  // on post, blocked by a car, blind, coming to you, in sight again, back to the
  // post - a shield pacing the middle of a street and covering nobody.
  e.postT = e.protect && e.protect.los ? 0 : e.postT + dt;
  // 1. what this kind wants
  if (e.kind === "runner" || e.kind === "sapper") {
    var wob = Math.sin(timeNow * 6 + e.ang) * (e.kind === "sapper" ? 0.28 : 0.5);
    vx = Math.cos(aim + wob); vy = Math.sin(aim + wob);
  } else if (e.kind === "weaver") {
    var sa = aim + Math.PI / 2 * e.sway;
    vx = ux * 0.55 + Math.cos(sa); vy = uy * 0.55 + Math.sin(sa);
  } else if (e.kind === "gunner" || e.kind === "sniper" || e.kind === "doc" || e.kind === "flinger") {
    // shooters hold a band and strafe around it: they never pile onto your feet
    var near = e.kind === "sniper" ? 330 : e.kind === "doc" ? 290 : e.kind === "flinger" ? 250 : 250;
    var far = e.kind === "sniper" ? 520 : e.kind === "doc" ? 470 : e.kind === "flinger" ? 440 : 380;
    var push = d < near ? -1 : (d > far ? 1 : 0);
    var tang = aim + Math.PI / 2 * e.side;
    vx = ux * push + Math.cos(tang) * 0.75; vy = uy * push + Math.sin(tang) * 0.75;
  } else if (e.kind === "shield" && e.protect && !e.protect.gone && (e.protect.los || e.postT < 1.2)) {
    // It guards the gun rather than walking at your feet - while the gun it guards
    // can still see you, or for a beat after it lost you behind something.
    var og = e.protect, gd = dist(P.x, P.y, og.x, og.y), stand = og.r + e.r + 12;
    if (gd > stand + e.r && d > PAIR_MIN_D) {     // you are not on top of them yet
      pairAnchor(e, og, _anchor);
      var ax = _anchor.x - e.x, ay = _anchor.y - e.y, al = Math.hypot(ax, ay) || 1;
      if (al < e.r * 0.7) {
        // On post. It does not stand there like street furniture and it does not
        // step side to side either - a brace SIDEWAYS is a plate that spends half
        // its life off the line it is standing on. It braces along the line
        // instead: a step in, a step back, always dead on the lane.
        e.stepMul = 0.34; e.hold = 1;
        var brace = Math.sin(timeNow * 1.7 + e.ang) > 0 ? 1 : -1;
        vx = Math.cos(aim) * brace; vy = Math.sin(aim) * brace;
      } else { vx = ax / al; vy = ay / al; }
    }
  } else if (e.kind === "burster" || e.kind === "spinner") {
    vx = ux * (d < 210 ? -0.5 : 1); vy = uy * (d < 210 ? -0.5 : 1);
  } else if (e.kind === "boss") {
    vx = ux * (d < 130 ? -0.3 : 1); vy = uy * (d < 130 ? -0.3 : 1);
  }
  var mn = Math.hypot(vx, vy) || 1; vx /= mn; vy /= mn;

  // 2. out of sight, the field knows better than it does
  e.pathT -= dt;
  if (!e.los) {
    if (e.pathT <= 0) { e.pathT = e.kind === "boss" ? 0.12 : 0.16; navWant(e); }
  } else e.onPath = false;
  if (e.onPath) {
    var pdx = e.pathX - e.x, pdy = e.pathY - e.y, pd = Math.hypot(pdx, pdy) || 1;
    vx = pdx / pd; vy = pdy / pd;
  }
  // A cell centre is only so precise, and a Brute is forty-four units across in a
  // doorway that is seventy-two: whatever the field decided, the last few steps
  // of a big body are aimed at the frame itself. This applies with or without a
  // path, because a Brute standing in a shop that cannot see you has exactly one
  // thing to do, and it is not walking into a counter.
  e.doorAim = 0;
  if (e.r > 13 && !e.los) {
    // Worth leaving the field for a doorway only if the doorway is close and
    // roughly where the field was already going. The nearest door to a body that
    // has just come through one is the door it came through - aiming at that
    // instead of the path reels it straight back to where it started, which is
    // exactly what this did the first time.
    var dr = doorNear(e, 84);
    if (dr) {
      var ddx = dr.x - e.x, ddy = dr.y - e.y, dl = Math.hypot(ddx, ddy) || 1;
      if (dl > 12 && (ddx / dl) * vx + (ddy / dl) * vy > 0.3) { vx = ddx / dl; vy = ddy / dl; e.doorAim = 1; }
    }
  }

  // 3. wedged against something: go round it, and keep going that way until it can be
  // SEEN to be working.
  //
  // Three things this had to learn the hard way. (a) The reference is the heading the
  // body actually had, not the line to the player - with the player as the reference, a
  // foe stopped by a wall that sits between it and you slides back into that wall,
  // because "perpendicular to you, plus most of the way to you" is the wall. (b) The
  // probe asks whether the BODY fits (r * 0.9), not whether there is wall material off
  // the nose (r * 0.5, which is right for the whiskers and wrong here); a 44-unit Brute
  // told that a 20-unit gap is open walks into it and calls that progress. (c) The
  // slide needs its own clock: a heading takes about ten frames to turn and 0.35 s is
  // one step, so on a timer tied to "stuck" it jitters on the corner instead of going
  // round it. What judges the slide is the distance to the field's next cell - not
  // whether the legs are moving, because sliding back into a corner is also moving.
  if (e.slideCd > 0) e.slideCd -= dt;
  if (e.slideT > 0 || (e.stuck > 0 && e.slideCd <= 0)) {
    if (e.stuck > 0) e.stuck -= dt;
    e.slideT -= dt;
    var glX = e.onPath ? e.pathX : P.x, glY = e.onPath ? e.pathY : P.y;
    var gd = dist(e.x, e.y, glX, glY);
    if (gd < e.slideD - 5) { e.slideD = gd; e.slideT = Math.max(e.slideT, 0.7); }   // this way is working
    if (e.slideT <= 0) {
      var sx = e.hvx, sy = e.hvy, sl = Math.hypot(sx, sy);
      if (sl < 0.2) { sx = vx; sy = vy; sl = Math.hypot(sx, sy) || 1; }             // never walked yet
      var base = Math.atan2(sy, sx), prb = 14 + e.r, sc, best = -1, bestV = 1e9;
      // Left, right, and then - the case that used to end in standing still - back the
      // way it came. A three-sided pocket has no side way out at all: the brute at ROW
      // HEIGHTS had walls west, south AND east, and its only exit was north, which no
      // pair of perpendiculars can point at. Reversing costs it a couple of seconds and
      // looks exactly like what a confused large body does in real life.
      for (sc = 0; sc < 3; sc++) {
        var ca = base + (sc === 0 ? Math.PI / 2 : sc === 1 ? -Math.PI / 2 : Math.PI);
        if (inWall(e.x + Math.cos(ca) * prb, e.y + Math.sin(ca) * prb, e.r * 0.9)) continue;
        // the field's own opinion, nudged by which way also closes on its goal, and
        // penalised for reversing so a body only backs up when nothing else is open
        var v = navValAt(e.x + Math.cos(ca) * prb, e.y + Math.sin(ca) * prb, e.r > NAVBIG) +
          (Math.cos(ca) * (glX - e.x) + Math.sin(ca) * (glY - e.y)) * 0.0015 + (sc === 2 ? 8 : 0);
        if (v < bestV) { bestV = v; best = ca; }
      }
      if (best < 0) { e.slideCd = 1.4; e.slideT = 0; }        // walled in on all sides: let the field re-plan
      else { e.slideA = best; e.slideT = 0.7; e.slideD = gd; e.side = sc === 1 ? -1 : 1; }
    }
    if (e.slideT > 0) { vx = Math.cos(e.slideA); vy = Math.sin(e.slideA); }
  }

  var px = e.x, py = e.y;
  // 3b. whiskers: probe a little ahead of the wanted heading and bend around it.
  // The field gets a foe to the right doorway; this is what stops it sawing
  // along the doorframe on the way through.
  var want = Math.atan2(vy, vx), probe = 24 + e.r, k;
  e.whisk -= dt;
  // The whiskers exist to stop a body rubbing along a wall. Pointed at a doorway
  // they do the opposite: the frame is the only opening there is, so reading it
  // as an obstacle bends the foe away from the gap it came for. Near a door the
  // aim is the aim, and the probe is skipped entirely.
  if (e.whisk > 0 && !e.doorAim) want = e.whiskA;
  else if (!e.doorAim && inWall(e.x + Math.cos(want) * probe, e.y + Math.sin(want) * probe, e.r * 0.55)) {
    for (k = 1; k <= 6; k++) {
      var off = k * 0.35, a1 = want + off, a2 = want - off;
      if (!inWall(e.x + Math.cos(a1) * probe, e.y + Math.sin(a1) * probe, e.r * 0.5)) { want = a1; break; }
      if (!inWall(e.x + Math.cos(a2) * probe, e.y + Math.sin(a2) * probe, e.r * 0.5)) { want = a2; break; }
    }
    e.whisk = 0.12; e.whiskA = want;
  }

  // 4. smoothing. A heading is a state now, not an instant decision, which is
  // the difference between a crew that walks and a crew that jitters.
  // While it is sliding, let it actually commit: at the normal rate the heading is
  // still halfway round when the slide runs out, and the foe goes back to walking
  // into the same corner.
  var kk = Math.min(1, dt * (e.slideT > 0 || e.stuck > 0 ? 30 : 11));
  var tx = Math.cos(want), ty = Math.sin(want);
  e.hvx += (tx - e.hvx) * kk; e.hvy += (ty - e.hvy) * kk;
  var hm = Math.hypot(e.hvx, e.hvy);
  if (hm < 1e-4) { e.hvx = tx; e.hvy = ty; hm = 1; }
  e.hvx /= hm; e.hvy /= hm;

  // stepMul is the shield's "on post" shuffle: the heading is a normal heading and
  // the legs are simply not driving at full rate, so a guarded gun reads as a foe
  // holding a line rather than one that has stopped.
  var spd = e.sp * (e.kind === "sapper" && e.fuse > 0 ? 1.3 : e.kind === "shield" ? 1.06 : 1) * e.stepMul;
  e.x += e.hvx * spd * dt;
  e.y += e.hvy * spd * dt;
  pushOut(e, e.r);                                       // both axes at once: one wall sweep per foe, not two

  // which way it is pointing: a shield or the Foreman faces what they are
  // bracing for, everyone else faces where they are going. Plates only turn
  // aside what they are facing, so this line is the whole shield fight.
  // (a shield guarding a gun faces you even from across the street: the plate is
  // there to cover the ally behind it, and a plate turned away is just a back)
  e.a = ((e.kind === "shield" && (d < 240 || e.protect)) || (e.kind === "boss" && e.los)) ? aim : Math.atan2(e.hvy, e.hvx);

  var moved2 = dist(px, py, e.x, e.y);
  e.moving = moved2 > spd * dt * 0.35 ? 1 : 0;
  if (e.moving) e.anim += dt * (e.kind === "runner" ? 11 : (e.kind === "brute" || e.kind === "boss") ? 5 : 7.6);
  // Flip, do not re-roll: a coin gives the blocked side a 50% vote every time,
    // which is half of why a wedged foe could sit out the rest of the wave.
  else if (e.stuck <= 0) { e.stuck = 0.35; e.side = -e.side; e.pathT = 0; }
  if (!e.entered && e.x > 4 && e.x < W - 4 && e.y > 4 && e.y < H - 4) e.entered = true;
}

// Back onto the ring, same as a fresh spawn, with every piece of local state that
// could carry the old bad decision wiped with it.
function navRing(e) {
  var a = rnd(0, TAU), rr = Math.max(VW, VH) * 0.60 + 40;
  e.x = clamp(P.x + Math.cos(a) * rr, 24, W - 24);
  e.y = clamp(P.y + Math.sin(a) * rr, 24, H - 24);
  if (inWall(e.x, e.y, e.r)) pushOut(e, e.r);
  e.stuck = 0; e.slideT = 0; e.slideCd = 0; e.pathT = 0; e.onPath = false;
  e.hvx = 0; e.hvy = 0; e.moving = 0; e.stallT = 0; e.nearD = 1e9;
  // Ringing is a fresh attempt at the walk, not a fresh hostile: it keeps its bullets,
  // its cooldowns and its wound, and the wave still has to be cleared on the clock it is
  // on. Killing it instead would quietly delete one of the kills the player has already
  // earned, and the shop price of a wave would depend on how bad the geometry was.
  e.stuck = 0; e.slideCd = 0;
}

// Bodies do not share a space. Without this the crew arrives one behind the
// other, and a queue one bullet wide is not a fight, it is a queue.
function foeShove(dt) {
  var i, j;
  for (i = 0; i < foes.length; i++) {
    var a = foes[i];
    for (j = i + 1; j < foes.length; j++) {
      var b = foes[j];
      var sdx = b.x - a.x, sdy = b.y - a.y, sr = a.r + b.r;
      var sd = Math.hypot(sdx, sdy);
      if (sd >= sr || sd < 0.001) continue;
      var wa = a.kbr, wb = b.kbr;                              // the Foreman does not move for anybody
      if (wa + wb < 0.01) { wa = wb = 1; }
      var ov = (sr - sd) / sd * Math.min(1, dt * 22);
      a.x -= sdx * ov * (wb / (wa + wb)) * 2; a.y -= sdy * ov * (wb / (wa + wb)) * 2;
      b.x += sdx * ov * (wa / (wa + wb)) * 2; b.y += sdy * ov * (wa / (wa + wb)) * 2;
      a.shoved = 1; b.shoved = 1;
    }
  }
  for (i = 0; i < foes.length; i++) { if (foes[i].shoved) { pushOut(foes[i], foes[i].r); foes[i].shoved = 0; } }
}

// ---- navigation: the grid, and the field that flows across it ---------------
// The steering above used to be entirely greedy: walk at the player, and when a
// wall turns up, sidestep until something else turns up. That works in a street
// and fails completely indoors, which is why the old crew gave up on doorways
// and watched you reload through a window.
// There is now a real grid over the block and a Dijkstra field that flows to
// wherever you are standing. One flow serves the whole crew, so a foe three
// streets away can pick the door that is actually open, come through it and keep
// following you between the furniture. Built with the map, re-flowed about five
// times a second (or instantly, when you have moved a whole cell) - which costs
// less than the line-of-sight probes the old code already ran every frame.
// Two grids, two clearances: blk/dist for anything small, blkB/distB for the bodies
// that are wider than a doorway's spare room. NAVBIG is the cut, and it is deliberately
// the same number the doorway-aiming code uses, so "this body needs the doors" and
// "this body needs the wide field" are always the same foes.
var NAVBIG = 13;
// Kept at 9, deliberately: the same clearance as the small grid, so the wide grid is a
// copy of it and nothing changes. 22 (the Brute's radius, plus doors declared open below)
// was tried in full and measured: 26/28 foes arrived instead of 27/28, and the failure
// moved indoors - a Brute in a shop whose lanes are all under about 50 units wide has no
// route at all when the walls are inflated by its own radius, and no amount of sliding
// fixes a route that does not exist. Wide inflations are welcome to be re-measured here.
var NAVBIGPAD = 9;
var NAV = { cs: 26, w: 0, h: 0, blk: null, dist: null, blkB: null, distB: null, t: 0, fresh: null };
var NDX = [1, -1, 0, 0, 1, 1, -1, -1], NDY = [0, 0, 1, -1, 1, -1, 0, 0];
var NDC = [10, 10, 10, 10, 14, 14, 14, 14];

function navBuild() {
  NAV.cs = 26;
  NAV.w = Math.max(2, Math.ceil(W / NAV.cs));
  NAV.h = Math.max(2, Math.ceil(H / NAV.cs));
  var n = NAV.w * NAV.h;
  NAV.blk = new Uint8Array(n); NAV.dist = new Uint16Array(n);
  NAV.blkB = new Uint8Array(n); NAV.distB = new Uint16Array(n);
  NAV.t = 0;
  // A cell is blocked when the wall - inflated by a little clearance - covers the
  // cell's CENTRE. Testing the whole cell instead sounds safer and is a lie: a
  // 62-unit doorway with 7 units of inflation is a 48-unit lane, and whenever
  // that lane happened to straddle a cell boundary not one entire cell fitted
  // inside it, the door got filed under "wall", and three of the thirteen
  // buildings quietly sealed themselves off. The clearance is what keeps a foe
  // from planning a line along the corner of a counter; pushOut does the rest.
  //
  // And then the same thing again for the big bodies, at their own radius. At 9 the
  // field will route a 44-unit Brute down a 30-unit gap: true of the point the field is
  // thinking about, false of the body that has to walk it, and that is how a Brute ends
  // up inside a three-sided pocket with no way out but back. Inflating by the whole

    }
  }

  // ---- enemy bullets (stepped too: graze + core hit stay reliable at speed)
  var gr = grazeR();
  for (var q = ebul.length - 1; q >= 0; q--) {
    var eb = ebul[q];
    eb.t += dt;
    if (eb.t > eb.life || eb.x < -30 || eb.x > W + 30 || eb.y < -30 || eb.y > H + 30) { ebul.splice(q, 1); continue; }
    var stp2 = Math.max(1, Math.ceil(Math.hypot(eb.vx, eb.vy) * dt / 5));
    var ex = eb.vx * dt / stp2, ey = eb.vy * dt / stp2, rm = false;
    for (var s2 = 0; s2 < stp2; s2++) {
      eb.x += ex; eb.y += ey;
      if (inWall(eb.x, eb.y, 0)) {
        spark(eb.x, eb.y, 3, eb.col, 90);
        if (eb.kind === "pot") potBurst(eb.x, eb.y, eb.dmg);
        rm = true; break;
      }
      if (eb.kind === "pot" && eb.t >= eb.fuse) { potBurst(eb.x, eb.y, eb.dmg); rm = true; break; }
      var db = dist(eb.x, eb.y, P.x, P.y);
      if (db < eb.r + P.core) {
        if (P.dashT <= 0) { hurt(eb.dmg); spark(eb.x, eb.y, 7, eb.col, 170); }
        rm = true; break;
      }
      if (!eb.grazed && db < eb.r + gr) {
        eb.grazed = true; credits += Math.round(1 * credMul()); score += 2;
        spark(P.x + (eb.x - P.x) * 0.4, P.y + (eb.y - P.y) * 0.4, 2, "#eef4fb", 60);
        tone(1500 + rnd(0, 300), 0.02, "triangle", 0.015, 1.1);
      }
    }
    if (rm) ebul.splice(q, 1);
  }

  // ---- turrets
  for (var ti2 = 0; ti2 < turrets.length; ti2++) {
    var t = turrets[ti2];
    t.cd -= dt; t.flash = Math.max(0, t.flash - dt);
    var bt = null, bd = turRange();
    for (var fk = 0; fk < foes.length; fk++) {
      var fd = dist(t.x, t.y, foes[fk].x, foes[fk].y);
      if (fd < bd && !lineBlocked(t.x, t.y, foes[fk].x, foes[fk].y)) { bd = fd; bt = foes[fk]; }
    }
    if (bt) {
      t.a = Math.atan2(bt.y - t.y, bt.x - t.x);
      if (t.cd <= 0) {
        t.cd = 0.2;
        bullets.push({
          x: t.x + Math.cos(t.a) * 14, y: t.y + Math.sin(t.a) * 14,
          vx: Math.cos(t.a) * 880, vy: Math.sin(t.a) * 880, dmg: turDmg(), r: 2.6, t: 0, life: 0.5,
          col: "#9fe8ff", pierce: 0, hit: [], kb: 10
        });
        tone(700, 0.03, "square", 0.02, 0.6); casing(t.x, t.y, t.a);
      }
    }
  }

  // ---- barrels: fuse telegraph, chain reaction, scorch mark left behind
  for (var bi = barrels.length - 1; bi >= 0; bi--) {
    var ba = barrels[bi];
    if (ba.hot > 0) ba.hot -= dt;
    if (ba.hp > 0) continue;
    if (ba.hot <= 0) { ba.hot = 0.2; spark(ba.x, ba.y - 6, 6, "#ff8a4c", 60); continue; }
    var bx = ba.x, by = ba.y;
    barrels.splice(bi, 1);
    boom(bx, by, "#ff8a4c", true);
    scorch.push({ x: bx, y: by, r: 62, t: 0 });
    fxFire(bx, by, 62, 12);                 // §7 glue: a drum leaves a proper pool
    for (var fk2 = foes.length - 1; fk2 >= 0; fk2--) {
      if (dist(bx, by, foes[fk2].x, foes[fk2].y) < 96 + foes[fk2].r) hurtFoe(fk2, 12, (foes[fk2].x - bx) * 8, (foes[fk2].y - by) * 8, 1);
    }
    if (dist(bx, by, P.x, P.y) < 84 + P.body) hurt(14);
    // neighbouring drums cook off too
    for (var cb = 0; cb < barrels.length; cb++) {
      if (dist(bx, by, barrels[cb].x, barrels[cb].y) < 104) { barrels[cb].hp -= 7; if (barrels[cb].hot <= 0) barrels[cb].hot = 0.26; }
    }
    if (Math.random() < 0.25) drops.push(dropAt(bx, by, pick(["ammo", "med", "kit"])));
  }
  for (var soi = scorch.length - 1; soi >= 0; soi--) {
    scorch[soi].t += dt;
    if (scorch[soi].t > 22) scorch.splice(soi, 1);
  }

  // ---- drops
  for (var di = drops.length - 1; di >= 0; di--) {
    var dr = drops[di];
    dr.t += dt; dr.x += dr.vx * dt; dr.y += dr.vy * dt; dr.vx *= 0.93; dr.vy *= 0.93;
    pushOut(dr, 8);
    var d2 = dist(dr.x, dr.y, P.x, P.y);
    if (d2 < 95) { dr.x += (P.x - dr.x) / d2 * 300 * dt; dr.y += (P.y - dr.y) / d2 * 300 * dt; }
    if (d2 < P.body + 11) {
      if (dr.kind === "med") { P.hp = Math.min(P.max, P.hp + 30); say("+30 HP", dr.x, dr.y - 10, "#69c07a"); }
      else if (dr.kind === "kit") { P.kits++; say("+1 kit", dr.x, dr.y - 10, "#4fd6c8"); }
      else {
        var gid = P.guns[P.gi], gg = GUNS[gid];
        if (!gg.melee) {
          var got = Math.ceil(gg.res * 0.3);
          P.res[gid] = Math.min(gg.res, (P.res[gid] || 0) + got);
          say("+" + got + " " + gg.ammo, dr.x, dr.y - 10, "#9fb3c9");
        } else { credits += 15; say("+15", dr.x, dr.y - 10, "#d9b64f"); }
      }
      tone(820, 0.07, "triangle", 0.04, 1.4); drops.splice(di, 1); continue;
    }
    if (dr.t > 16) drops.splice(di, 1);
  }

  // ---- particles / shells
  for (var pi = parts.length - 1; pi >= 0; pi--) {
    var pa = parts[pi]; pa.t += dt; pa.x += pa.vx * dt; pa.y += pa.vy * dt; pa.vx *= 0.93; pa.vy *= 0.93;
    if (pa.t > pa.life) parts.splice(pi, 1);
  }
  for (var ri = ripples.length - 1; ri >= 0; ri--) {
    ripples[ri].t += dt; if (ripples[ri].t > ripples[ri].life) ripples.splice(ri, 1);
  }
  // §7 owns the burning ground and ticks it here, outside the foe loop, because a
  // pool can kill and killFoe splices the array this loop's siblings are walking.
  fxFireTick(dt);
  for (var si = shells.length - 1; si >= 0; si--) {
    var sh = shells[si]; sh.t += dt; sh.x += sh.vx * dt; sh.y += sh.vy * dt; sh.vx *= 0.88; sh.vy *= 0.88; sh.a += dt * 12;
    if (sh.t > sh.life) shells.splice(si, 1);
  }

  comboT -= dt; if (comboT <= 0) combo = 1;
  shake = Math.max(0, shake - dt * 34);
  for (var fli = floaters.length - 1; fli >= 0; fli--) {
    var fl2 = floaters[fli]; fl2.t += dt; fl2.y -= 16 * dt;
    if (fl2.t > fl2.life) floaters.splice(fli, 1);
  }
  hitFlash = Math.max(0, hitFlash - dt * 2.2);
  if (countT > 0) countT -= dt;
  uiRows = shopOpen ? shopRows() : uiRows;
}
function hitBarrel(i, dmg) {
  var b = barrels[i]; if (!b) return;
  b.hp -= dmg; spark(b.x, b.y - 4, 3, "#ff8a4c", 110);
}

function updateFx(dt) {
  for (var i = parts.length - 1; i >= 0; i--) {
    var pa = parts[i]; pa.t += dt; pa.x += pa.vx * dt; pa.y += pa.vy * dt; pa.vx *= 0.93; pa.vy *= 0.93;
    if (pa.t > pa.life) parts.splice(i, 1);
  }
  shake = Math.max(0, shake - dt * 34);
  hitFlash = Math.max(0, hitFlash - dt * 2);
}

// ============================================================ draw helpers
// [Subsystem 16] Rendering primitives. Owns text, panel, dim, wrap, shade,
// shadowOval, box3d, drum3d, pin. Pure drawing utilities. See SYSTEMS.md §16.
// NOTE(pi-2): text() and panel() used to exist twice in this scope, the first pair
// shadowed by the second, so editing the first did nothing at all. One pair now.

// ============================================================ draw
var dt_smooth = 0.18;
// Barrel lengths per gun, in world px, for the gun-arm the player render draws.
// (Melee blades are short; the long guns should look long even at low res.)
var GUN_LEN = { knife: 8, dagger: 6, flint: 9, rev: 9, smg: 10, ak: 15, lmg: 16,
  gun: 13, sawn: 8, bolt: 16, pot: 11, flam: 12 };
// [Subsystem 17] Graphics renderer. Y-sorted world render: ground→walls→entities
// →roofs→fx, then screen-space HUD/UI. Owns slist. See SYSTEMS.md §17.

// ---- text + panels ------------------------------------------------------
// Drawn under the device-pixel transform, so glyphs are rasterised at the
// resolution of the monitor instead of being stretched from a small bitmap.
function text(str, x, y, size, col, align, glow) {
  // Glyphs are rasterised at INTEGER device-pixel size in device space (see
  // the note above about qpx): the pixelated CSS upscale then leaves text
  // crisp and chunky instead of a blurred smear of antialiased grey.
  gx.save();
  gx.setTransform(1, 0, 0, 1, 0, 0);
  gx.font = "bold " + Math.max(5, Math.round(size * SC)) + "px 'Segoe UI',Arial,sans-serif";
  gx.textAlign = align || "left";
  gx.textBaseline = "alphabetic";
  if (glow) { gx.shadowColor = glow; gx.shadowBlur = Math.round(14 * SC); }
  gx.fillStyle = col; gx.fillText(str, Math.round(x * SC), Math.round(y * SC));
  gx.restore();
}
function panel(x, y, w, h, a) {
  gx.fillStyle = "rgba(9,12,17," + (a || 0.86) + ")"; gx.fillRect(x, y, w, h);
  gx.fillStyle = "rgba(255,255,255,.04)"; gx.fillRect(x, y, w, 2);
  gx.strokeStyle = "rgba(120,150,190,.35)"; gx.lineWidth = 2; gx.strokeRect(x + 1, y + 1, w - 2, h - 2);
}
function dim(a) { gx.fillStyle = "rgba(4,6,9," + a + ")"; gx.fillRect(0, 0, VW, VH); }
function wrap(str, x, y, maxw, size, col) {
  var words = str.split(" "), line = "", yy = y;
  gx.font = size + "px Arial";
  for (var i = 0; i < words.length; i++) {
    var test = line ? line + " " + words[i] : words[i];
    if (gx.measureText(test).width > maxw && line) { text(line, x, yy, size, col); line = words[i]; yy += size + 4; }
    else line = test;
  }
  if (line) text(line, x, yy, size, col);
}
function pin(txt, x, y, col) {
  gx.save();
  gx.globalAlpha = 0.9;
  gx.fillStyle = "rgba(0,0,0,.55)"; gx.beginPath(); gx.arc(x, y, 11, 0, TAU); gx.fill();
  gx.strokeStyle = col; gx.lineWidth = 2; gx.beginPath(); gx.arc(x, y, 11, 0, TAU); gx.stroke();
  gx.restore();
  text(txt, x, y + 5, 13, col, "center");
}

// ---- world layers -------------------------------------------------------
var CARC = ["#7e2b28", "#48709f", "#39424e", "#69758a", "#4d7f57", "#8c3a6a"];

function drawGround() {
  var x0 = cam.x - 40, y0 = cam.y - 40, x1 = cam.x + VW + 40, y1 = cam.y + VH + 40;
  gx.fillStyle = LP.asphalt; gx.fillRect(x0, y0, x1 - x0, y1 - y0);
  // the grid is nailed to the world, which is what sells the walking
  gx.strokeStyle = "rgba(255,255,255,.05)"; gx.lineWidth = 1;
  gx.beginPath();
  var x, y, i;
  for (x = Math.floor(x0 / 40) * 40; x <= x1; x += 40) { gx.moveTo(x, y0); gx.lineTo(x, y1); }
  for (y = Math.floor(y0 / 40) * 40; y <= y1; y += 40) { gx.moveTo(x0, y); gx.lineTo(x1, y); }
  gx.stroke();
  // sidewalks: every lot gets a concrete apron with a lit kerb edge. The apron
  // stops a dozen units out from the wall, so the street between the lots is
  // still tarmac - otherwise the whole block reads as one grey slab.
  gx.beginPath();
  for (i = 0; i < roofs.length; i++) {
    var rt = roofs[i];
    if (rt.x > x1 || rt.x + rt.w < x0 || rt.y > y1 || rt.y + rt.h < y0) continue;
    gx.rect(rt.x - 16, rt.y - 16, rt.w + 32, rt.h + 32);
  }
  gx.fillStyle = LP.walk; gx.fill();
  gx.strokeStyle = "rgba(255,255,255,.16)"; gx.lineWidth = 2; gx.stroke();
  // pools of lamp light + a soft shadow under every street barrier. In full day
  // the street lamps are barely lit, so the pool fades with the map's sun.
  gx.beginPath();
  for (i = 0; i < poles.length; i++) {
    var pl = poles[i];
    if (pl.kind !== "lamp" || pl.x < x0 - 60 || pl.x > x1 + 60 || pl.y < y0 - 60 || pl.y > y1 + 60) continue;
    gx.moveTo(pl.x + 44, pl.y + 10);
    gx.ellipse(pl.x, pl.y + 10, 44, 26, 0, 0, TAU);
  }
  gx.fillStyle = "rgba(217,182,79," + (0.05 * LS.lamp) + ")"; gx.fill();
  // tarmac patches, painted crossings, manhole covers
  for (i = 0; i < decals.length; i++) {
    var dc = decals[i];
    if (dc.x > x1 || dc.x + dc.w < x0 || dc.y > y1 || dc.y + dc.h < y0) continue;
    if (dc.kind === "zebra") { gx.fillStyle = "rgba(240,246,255,.34)"; gx.fillRect(dc.x, dc.y, dc.w, dc.h); }
    else if (dc.kind === "lane") { gx.fillStyle = "rgba(240,246,255,.17)"; gx.fillRect(dc.x, dc.y, dc.w, dc.h); }
    else if (dc.kind === "patch") { gx.fillStyle = "rgba(0,0,0,.12)"; gx.fillRect(dc.x, dc.y, dc.w, dc.h); }
    else {
      gx.fillStyle = "rgba(0,0,0,.18)"; gx.beginPath();
      gx.arc(dc.x + dc.w / 2, dc.y + dc.h / 2, dc.w / 2, 0, TAU); gx.fill();
      gx.strokeStyle = "rgba(255,255,255,.14)"; gx.lineWidth = 2; gx.stroke();
    }
  }
  // scorch marks where drums went off
  for (i = 0; i < scorch.length; i++) {
    var sc = scorch[i];
    gx.fillStyle = "rgba(10,6,4," + (0.38 * clamp(1 - sc.t / 22, 0, 1)) + ")";
    gx.beginPath(); gx.ellipse(sc.x, sc.y, sc.r, sc.r * 0.6, 0, 0, TAU); gx.fill();
  }
  // indoor tile floors, sunk into the room (only once the roof is open - an
  // interior you cannot see through does not need its tiles drawn)
  gx.beginPath();
  for (i = 0; i < floors.length; i++) {
    var fl = floors[i];
    if (roofs[i] && roofs[i].a > 0.55) continue;
    if (fl.x > x1 || fl.x + fl.w < x0 || fl.y > y1 || fl.y + fl.h < y0) continue;
    gx.fillStyle = LP.floor; gx.fillRect(fl.x, fl.y, fl.w, fl.h);
    gx.fillStyle = "rgba(255,255,255,.045)";
    for (y = fl.y + 20; y < fl.y + fl.h; y += 40) for (x = fl.x + ((y / 20) % 40 === 0 ? 20 : 0); x < fl.x + fl.w; x += 40) gx.rect(x, y, 20, 20);
    gx.fillStyle = "rgba(0,0,0,.20)"; gx.fillRect(fl.x, fl.y, fl.w, 8); gx.fillRect(fl.x, fl.y, 8, fl.h);
  }
  gx.fillStyle = "rgba(255,255,255,.045)"; gx.fill();
  gx.strokeStyle = "rgba(0,0,0,.26)"; gx.lineWidth = 1; gx.beginPath();
  for (i = 0; i < floors.length; i++) {
    var f2 = floors[i];
    if (roofs[i] && roofs[i].a > 0.55) continue;
    if (f2.x > x1 || f2.x + f2.w < x0 || f2.y > y1 || f2.y + f2.h < y0) continue;
    for (y = f2.y + 20; y < f2.y + f2.h; y += 20) { gx.moveTo(f2.x, y + .5); gx.lineTo(f2.x + f2.w, y + .5); }
  }
  gx.stroke();
  // sunlight lying on the threshold: the strip of street that reaches inside
  for (i = 0; i < doors.length; i++) {
    gx.fillStyle = "rgba(255,236,190,.15)"; gx.fillRect(doors[i].x - 14, doors[i].y - 14, 28, 28);
    gx.fillStyle = "rgba(255,236,190,.08)"; gx.fillRect(doors[i].x - 22, doors[i].y - 22, 44, 44);
  }
  // burning ground is painted on the floor, under every y-sorted entity: §7 owns
  // the pool and the flame, §17 only decides which layer it lies on
  fxFireDraw();
}

// walls / barriers as extruded blocks
function drawWalls() {
  var i, x0 = cam.x - 60, y0 = cam.y - 60, x1 = cam.x + VW + 60, y1 = cam.y + VH + 60;
  for (i = 0; i < walls.length; i++) {
    var w = walls[i];
    if (w.prop) continue;                                   // props are y-sorted instead
    if (w.x > x1 || w.x + w.w < x0 || w.y > y1 || w.y + w.h < y0) continue;
    box3d(w.x, w.y, w.w, w.h, 10, LP.wall, { front: LP.wallF, side: LP.wallS });
  }
  // poles and hydrants: thin extrusions with long cast shadows
  for (i = 0; i < poles.length; i++) {
    var po = poles[i];
    if (po.x < x0 - 40 || po.x > x1 + 40 || po.y < y0 - 40 || po.y > y1 + 40) continue;
    if (po.kind === "drum") { drum3d(po.x, po.y, po.r, 0); continue; }
    if (po.kind === "lamp") {
      shadowOval(po.x + 3, po.y + 4, 9, 4, 0.3);                        // foot shadow
      box3d(po.x - 5, po.y - 2, 10, 8, 5, shade(LP.wall, 0.78));         // base
      gx.fillStyle = LP.wall; gx.fillRect(po.x - 2, po.y - 16, 4, 16);   // pole
      gx.fillStyle = "rgba(255,255,255,.28)"; gx.fillRect(po.x - 2, po.y - 16, 1.5, 16);
      gx.fillStyle = "#5d6b7e"; gx.fillRect(po.x - 5, po.y - 20, 10, 5);  // lamp hood
      gx.fillStyle = "rgba(255,236,170," + (0.18 + 0.62 * LS.lamp) + ")"; gx.fillRect(po.x - 4, po.y - 19, 8, 2);
    } else {
      shadowOval(po.x + 2, po.y + 4, 7, 3.5, 0.32);
      box3d(po.x - 4, po.y - 10, 8, 12, 5, "#a03a2e");
      gx.fillStyle = "#c04a35"; gx.fillRect(po.x - 6, po.y - 13, 12, 4);
      gx.fillStyle = "rgba(255,255,255,.2)"; gx.fillRect(po.x - 6, po.y - 13, 12, 1.5);
    }
  }
  drawWindows();
}

// Glazing on the two sides the sun actually strikes: a dark opening, a cold
// window, and a warm glint on the glass. Only visible once a roof has lifted
// (the deck covers the wall tops otherwise), which is exactly when you are
// close enough to be looking into the building.
function drawWindows() {
  var i, j, x0 = cam.x - 60, y0 = cam.y - 60, x1 = cam.x + VW + 60, y1 = cam.y + VH + 60;
  for (i = 0; i < roofs.length; i++) {
    var ro = roofs[i];
    if (ro.x > x1 || ro.x + ro.w < x0 || ro.y > y1 || ro.y + ro.h < y0) continue;
    for (j = 0; j < ro.win.length; j++) {
      var w = ro.win[j];
      if (w.h) {
        gx.fillStyle = "rgba(8,12,18,.65)"; gx.fillRect(w.x - 9, w.y - 5, 18, 10);
        gx.fillStyle = "rgba(186,220,255,.5)"; gx.fillRect(w.x - 8, w.y - 4, 16, 8);
        gx.fillStyle = "rgba(255,246,214,.4)"; gx.fillRect(w.x - 8, w.y - 4, 16, 3);
      } else {
        gx.fillStyle = "rgba(8,12,18,.65)"; gx.fillRect(w.x - 5, w.y - 9, 10, 18);
        gx.fillStyle = "rgba(186,220,255,.42)"; gx.fillRect(w.x - 4, w.y - 8, 8, 16);
        gx.fillStyle = "rgba(255,246,214,.3)"; gx.fillRect(w.x - 4, w.y - 8, 3, 16);
      }
