function drawProp(p) {
  if (p.kind === "car") {
    var col = CARC[Math.abs(Math.round(p.x * 0.13)) % CARC.length];
    box3d(p.x, p.y, p.w, p.h, 12, col, { front: shade(col, 0.5), side: shade(col, 0.34) });
    var cx = p.w > p.h ? p.x + p.w * 0.28 : p.x + 6, cy = p.w > p.h ? p.y + 5 : p.y + p.h * 0.28;
    var cwid = p.w > p.h ? p.w * 0.44 : p.w - 12, chig = p.w > p.h ? p.h - 10 : p.h * 0.44;
    gx.fillStyle = shade(col, 0.62); gx.fillRect(cx, cy, cwid, chig);         // cabin roof
    gx.fillStyle = "rgba(160,200,240,.22)"; gx.fillRect(cx, cy, cwid, 4);      // windscreen
    gx.fillStyle = "rgba(255,255,255,.10)"; gx.fillRect(p.x, p.y, p.w, 2);
    gx.fillStyle = "rgba(217,182,79,.5)";
    if (p.w > p.h) { gx.fillRect(p.x + 1, p.y + 3, 4, 5); gx.fillRect(p.x + p.w - 5, p.y + 3, 4, 5); }
    else { gx.fillRect(p.x + 3, p.y + 1, 5, 4); gx.fillRect(p.x + 3, p.y + p.h - 5, 5, 4); }
    return;
  }
  if (p.kind === "cabinet") { box3d(p.x, p.y, p.w, p.h, 10, "#7a6f4d", { lines: "v" }); gx.fillStyle = "rgba(238,244,251,.25)"; for (var i = p.x + 8; i < p.x + p.w - 4; i += 15) gx.fillRect(i, p.y + p.h - 5, 5, 2); }
  else if (p.kind === "counter") { box3d(p.x, p.y, p.w, p.h, 11, "#5f6c7d", { lines: "v" }); gx.fillStyle = "rgba(255,255,255,.14)"; gx.fillRect(p.x + 2, p.y + 2, p.w - 4, 3); }
  else if (p.kind === "shelf") { box3d(p.x, p.y, p.w, p.h, 11, "#8d7f57", { lines: "h" }); gx.fillStyle = "rgba(79,214,200,.20)"; gx.fillRect(p.x + 4, p.y + 4, p.w - 8, 3); gx.fillStyle = "rgba(217,182,79,.20)"; gx.fillRect(p.x + 4, p.y + p.h - 8, p.w - 8, 3); }
  else if (p.kind === "crate") {
    box3d(p.x, p.y, p.w, p.h, 11, "#b08e63", { lines: "v" });
    gx.strokeStyle = "rgba(60,40,20,.5)"; gx.lineWidth = 2;
    gx.beginPath(); gx.moveTo(p.x + 2, p.y + 2); gx.lineTo(p.x + p.w - 2, p.y + p.h - 2);
    gx.moveTo(p.x + p.w - 2, p.y + 2); gx.lineTo(p.x + 2, p.y + p.h - 2); gx.stroke();
  } else if (p.kind === "pallet") { box3d(p.x, p.y, p.w, p.h, 6, "#6f6647", { lines: "h" }); }
  else if (p.kind === "bench") { box3d(p.x, p.y, p.w, p.h, 10, "#446488", { lines: "v" }); gx.fillStyle = "rgba(238,244,251,.18)"; gx.fillRect(p.x + 3, p.y + 3, p.w - 6, 2); }
  else box3d(p.x, p.y, p.w, p.h, 9, "#69758a");
}

// A cache has to be worth finding, so it is allowed to advertise itself: a pool
// of light on the ground, a slow bob, a one-frame glint every few seconds, and a
// ring that fills while you pry. Once it is opened it goes flat and half-lit -
// an emptied box should stop asking for attention.
function drawCache(o) {
  var col = o.big ? "#ffd678" : "#4fd6c8";
  var bob = Math.sin(timeNow * 2.2 + o.t) * 1.2;
  shadowOval(o.x + 2, o.y + 10, o.big ? 12 : 10, 5, o.open ? 0.16 : 0.32);
  if (!o.open) {
    gx.save();
    var pulse = 0.55 + 0.45 * Math.sin(timeNow * 2.4 + o.t);
    for (var k = 3; k >= 1; k--) {
      gx.globalAlpha = 0.045 + 0.05 * (4 - k) * pulse;
      gx.fillStyle = col;
      gx.beginPath(); gx.ellipse(o.x, o.y + 9, 14 + k * 9, (14 + k * 9) * 0.42, 0, 0, TAU); gx.fill();
    }
    gx.restore();
  }
  gx.save();
  if (o.open) gx.globalAlpha = 0.4;
  spr(o.big ? "vault" : "cache", o.x, o.y - 2 + bob, o.big ? 25 : 21, null,
      !o.open && o.pry <= 0 && (timeNow * 2.2 + o.t) % 3.4 > 3.1, 0, 0);
  gx.restore();
  if (o.open) {
    gx.fillStyle = "rgba(11,15,20,.5)"; gx.fillRect(o.x - 5, o.y - 4, 10, 6);   // the open mouth
    return;
  }
  if (o.pry > 0) {
    var f = clamp(o.pry / (o.big ? CACHE_VAULT_PRY : CACHE_PRY), 0, 1);
    gx.save();
    gx.strokeStyle = "rgba(10,14,20,.75)"; gx.lineWidth = 4;
    gx.beginPath(); gx.arc(o.x, o.y, 20, 0, TAU); gx.stroke();
    gx.strokeStyle = col; gx.lineWidth = 3;
    gx.beginPath(); gx.arc(o.x, o.y, 20, -Math.PI / 2, -Math.PI / 2 + TAU * f); gx.stroke();
    gx.restore();
    text(Math.round(f * 100) + "%", vxA(o.x), vyA(o.y) - 26, 12, col, "center");
  }
}

// the roof slab, extruded. It slides up and fades as it opens.
function drawRoof(ro) {
  var lift = 1 - ro.a;
  gx.save();
  gx.globalAlpha = clamp(ro.a, 0, 1);
  gx.translate(0, -lift * 30);
  shadowOval(ro.x + ro.w / 2 + 12, ro.y + ro.h + 12, ro.w * 0.56, ro.h * 0.3, 0.34);
  gx.fillStyle = LP.roofS; gx.fillRect(ro.x, ro.y + ro.h, ro.w, 11);        // south fascia
  gx.fillStyle = LP.roofE; gx.fillRect(ro.x + ro.w, ro.y, 11, ro.h + 11);     // east fascia
  gx.fillStyle = LP.roof; gx.fillRect(ro.x, ro.y, ro.w, ro.h);                // roof deck
  gx.strokeStyle = "rgba(0,0,0,.30)"; gx.lineWidth = 2;
  gx.strokeRect(ro.x + 1, ro.y + 1, ro.w - 2, ro.h - 2);                      // parapet
  gx.strokeStyle = "rgba(255,255,255,.07)"; gx.lineWidth = 1;
  gx.beginPath();
  var rx, ry;
  for (rx = ro.x + 26; rx < ro.x + ro.w; rx += 34) { gx.moveTo(rx + .5, ro.y + 4); gx.lineTo(rx + .5, ro.y + ro.h - 4); }
  for (ry = ro.y + 26; ry < ro.y + ro.h; ry += 30) { gx.moveTo(ro.x + 4, ry + .5); gx.lineTo(ro.x + ro.w - 4, ry + .5); }
  gx.stroke();
  gx.fillStyle = "rgba(255,255,255,.16)"; gx.fillRect(ro.x, ro.y, ro.w, 4);      // sunlit ridge
  gx.fillStyle = "rgba(0,0,0,.16)"; gx.fillRect(ro.x, ro.y + ro.h - 5, ro.w, 5);
  gx.fillStyle = shade(LP.wall, 0.82);                                          // rooftop vents
  gx.fillRect(ro.x + 16, ro.y + 16, 20, 14); gx.fillRect(ro.x + ro.w - 40, ro.y + ro.h - 32, 22, 16);
  gx.fillStyle = "rgba(255,255,255,.22)";
  gx.fillRect(ro.x + 16, ro.y + 16, 20, 3); gx.fillRect(ro.x + ro.w - 40, ro.y + ro.h - 32, 22, 3);
  gx.restore();
}

// does this ceiling need to be open?
function roofTarget(ro) {
  var i;
  if (P && inRect(ro, P.x, P.y)) return 0;                                   // you are in the room
  // ...or merely looking into it: the camera scrolls into a building as soon as
  // you aim past its wall, which is what makes the indoors read as somewhere
  // you can go rather than a painted box
  if (P && !shopOpen && state === "play" && inRect(ro, mouse.x, mouse.y)) return 0;
  for (i = 0; i < foes.length; i++) if (inRect(ro, foes[i].x, foes[i].y)) return 0;   // never hide an enemy
  for (i = 0; i < turrets.length; i++) if (inRect(ro, turrets[i].x, turrets[i].y)) return 0;
  for (i = 0; i < doors.length; i++) {                                        // standing in the doorway looking in
    if (dist(P.x, P.y, doors[i].x, doors[i].y) < 62 && distToRect(ro, doors[i].x, doors[i].y) < 6) return 0;
  }
  return 1;
}

function drawRoofs() {
  var i, x0 = cam.x - 80, y0 = cam.y - 110, x1 = cam.x + VW + 80, y1 = cam.y + VH + 80;
  for (i = 0; i < roofs.length; i++) {
    var ro = roofs[i];
    var target = roofTarget(ro);
    ro.a += (target - ro.a) * Math.min(1, dt_smooth * 1.6);
    if (ro.a < 0.02 && target === 0) continue;
    if (ro.x > x1 || ro.x + ro.w < x0 || ro.y > y1 || ro.y + ro.h < y0) continue;
    drawRoof(ro);
  }
  // anything still hiding under a shut roof gets a silhouette so the ceiling
  // never becomes a blind spot
  for (i = 0; i < roofs.length; i++) {
    var ro2 = roofs[i];
    if (ro2.a > 0.5) continue;
    if (ro2.x > x1 || ro2.x + ro2.w < x0 || ro2.y > y1 || ro2.y + ro2.h < y0) continue;
    for (var f = 0; f < foes.length; f++) {
      var e = foes[f];
      if (!inRect(ro2, e.x, e.y)) continue;
      gx.save(); gx.globalAlpha = 0.10 * ro2.a;
      gx.fillStyle = "#000"; gx.beginPath(); gx.ellipse(e.x, e.y + 4, e.r * 1.2, e.r * 0.7, 0, 0, TAU); gx.fill();
      gx.strokeStyle = e.col; gx.lineWidth = 2;
      gx.beginPath(); gx.arc(e.x, e.y, e.r + 3, 0, TAU); gx.stroke();
      gx.restore();
    }
  }
}

// props + barrels + entities share one y-sorted list so things in front of you
// really do cover things behind you
// ---------------------------------------------------------------- lighting
// [Subsystem 17b] Daylight outside, indoors when you are inside.
// Outside is broad daylight: the sky lights every street, each building throws
// a short shadow away from the sun, and the only real darkness left in the
// frame is indoors. When the camera follows you into a building the roof has
// already lifted, so the room drops into its own indoor light - and the sun
// only gets in through the doorways, the windows on the sunny side, your own
// torch and the ceiling strips. It is all drawn into one offscreen buffer at
// half size (light is soft, so it can be cheap) and dropped over the world.
// Nothing here changes gameplay: enemies, bullets and drops are all lit by the
// same pass as everything else.
var LIT = { cv: null, cx: null, s: 0.5, bad: false };
function litBuf() {
  if (!LIT.cv && !LIT.bad) {
    try {
      LIT.cv = document.createElement("canvas");
      LIT.cx = LIT.cv.getContext("2d");
      if (!LIT.cx || typeof LIT.cx.setTransform !== "function") LIT.bad = true;
    } catch (e) { LIT.bad = true; }
  }
  return (!LIT.bad && LIT.cv && LIT.cx) ? { c: LIT.cv, x: LIT.cx } : null;
}
// A soft disc of light. An environment that cannot build a gradient gets a flat
// disc instead, so the lighting degrades and the game keeps running.
function litDisc(cx, x, y, r, a) {
  var g = null;
  try {
    g = cx.createRadialGradient(x, y, 0, x, y, r);
    if (g && g.addColorStop) {
      g.addColorStop(0, "rgba(255,255,255," + a + ")");
      g.addColorStop(0.5, "rgba(255,255,255," + (a * 0.62) + ")");
      g.addColorStop(1, "rgba(255,255,255,0)");
    } else g = null;
  } catch (e) { g = null; }
  cx.fillStyle = g || "rgba(255,255,255," + (a * 0.55) + ")";
  cx.beginPath(); cx.arc(x, y, r, 0, TAU); cx.fill();
}
// warm spill on the main canvas: sun is never just 'less dark'
function warmDisc(x, y, r, a, col) {
  var g = null;
  try {
    g = gx.createRadialGradient(x, y, 0, x, y, r);
    if (g && g.addColorStop) {
      g.addColorStop(0, col.replace("$A", a));
      g.addColorStop(1, col.replace("$A", 0));
    } else g = null;
  } catch (e) { g = null; }
  gx.fillStyle = g || col.replace("$A", a * 0.6);
  gx.beginPath(); gx.arc(x, y, r, 0, TAU); gx.fill();
}
// a point indoors, just past a doorway
function doorIn(d, howFar) {
  var nx = d.side === "w" ? 1 : d.side === "e" ? -1 : 0;
  var ny = d.side === "n" ? 1 : d.side === "s" ? -1 : 0;
  return { x: d.x + nx * howFar, y: d.y + ny * howFar };
}

function drawLighting() {
  var i, j, buf = litBuf();
  var x0 = cam.x - 90, y0 = cam.y - 90, x1 = cam.x + VW + 90, y1 = cam.y + VH + 90;
  if (!buf) { flatIndoors(x0, y0, x1, y1); return; }
  var lc = buf.c, cx = buf.x;
  var bw = Math.max(2, Math.round(cv.width * LIT.s)), bh = Math.max(2, Math.round(cv.height * LIT.s));
  if (lc.width !== bw) lc.width = bw;
  if (lc.height !== bh) lc.height = bh;
  var k = SC * LIT.s;
  cx.setTransform(1, 0, 0, 1, 0, 0);
  cx.clearRect(0, 0, bw, bh);
  cx.setTransform(k, 0, 0, k, -cam.x * k, -cam.y * k);
  cx.globalCompositeOperation = "source-over";

  // 1. the shadow every building throws across the pavement - short, and all in
  //    the same direction, because the sun is high and on one side of the map
  cx.fillStyle = "rgba(8,12,20," + LS.shadow + ")";
  cx.beginPath();
  for (i = 0; i < roofs.length; i++) {
    var r0 = roofs[i];
    if (r0.x > x1 || r0.x + r0.w < x0 || r0.y > y1 || r0.y + r0.h < y0) continue;
    cx.rect(r0.x + LS.sx, r0.y + LS.sy, r0.w + LS.sx, r0.h + LS.sy);
  }
  cx.fill();

  // 2. the rooms themselves: indirect light only, so a shop interior always
  //    sits a couple of stops under the street outside it
  for (i = 0; i < roofs.length; i++) {
    var ro = roofs[i], open = clamp(1 - ro.a, 0, 1);
    if (open < 0.03) continue;
    if (ro.x > x1 || ro.x + ro.w < x0 || ro.y > y1 || ro.y + ro.h < y0) continue;
    cx.fillStyle = "rgba(10,14,22," + (LS.room * open) + ")";
    cx.fillRect(ro.x, ro.y, ro.w, ro.h);
    cx.fillStyle = "rgba(10,14,22," + (0.18 * open) + ")";          // parapet shade
    cx.fillRect(ro.x, ro.y, ro.w, 22); cx.fillRect(ro.x, ro.y, 22, ro.h);
  }

  // 3. put the light back wherever it genuinely gets in
  cx.globalCompositeOperation = "destination-out";
  for (i = 0; i < roofs.length; i++) {
    var ro2 = roofs[i], open2 = clamp(1 - ro2.a, 0, 1);
    if (ro2.x > x1 || ro2.x + ro2.w < x0 || ro2.y > y1 || ro2.y + ro2.h < y0) continue;
    if (ro2.a > 0.02) {                                              // the deck is sunlit
      cx.fillStyle = "rgba(255,255,255," + clamp(ro2.a, 0, 1) + ")";
      cx.fillRect(ro2.x, ro2.y, ro2.w, ro2.h);
    }
    if (open2 < 0.03) continue;
    for (j = 0; j < ro2.lamp.length; j++) litDisc(cx, ro2.lamp[j].x, ro2.lamp[j].y, 76, 0.62 * open2);
    for (j = 0; j < doors.length; j++) {
      if (distToRect(ro2, doors[j].x, doors[j].y) > 10) continue;
      var dp = doorIn(doors[j], 22);
      litDisc(cx, dp.x, dp.y, 56, 0.62 * open2);
    }
    for (j = 0; j < ro2.win.length; j++) {
      var wn = ro2.win[j];
      litDisc(cx, wn.x + wn.dx * 20, wn.y + wn.dy * 20, 40, 0.5 * open2);
    }
  }
  // your torch, your muzzle, and anything on fire
  if (P) {
    litDisc(cx, P.x, P.y, 190, 0.45);
    if (pflash > 0) litDisc(cx, P.x + Math.cos(P.a) * 22, P.y + Math.sin(P.a) * 22, 175, 0.42 * (pflash / 0.07));
  }
  for (i = 0; i < foes.length; i++) if (foes[i].burn > 0) litDisc(cx, foes[i].x, foes[i].y, 54, 0.3);
  for (i = 0; i < barrels.length; i++) if (barrels[i].hp <= 0 || barrels[i].hot > 0) litDisc(cx, barrels[i].x, barrels[i].y, 62, 0.22);
  // burning ground lights the street it is standing on, and it flickers
  for (i = 0; i < fires.length; i++) {
    var gfi = fires[i];
    litDisc(cx, gfi.x, gfi.y, gfi.r * 2.4, 0.3 * clamp(1 - gfi.t / gfi.life, 0, 1) * (0.86 + 0.14 * Math.sin(timeNow * 12 + gfi.seed)));
  }

  // 4. drop the buffer over the world. Light is soft, so the upscale is
  //    smoothed - sprites stay nearest-neighbour everywhere else.
  gx.save();
  gx.setTransform(1, 0, 0, 1, 0, 0);
  gx.imageSmoothingEnabled = true;
  gx.globalAlpha = 1;
  gx.drawImage(lc, 0, 0, cv.width, cv.height);
  gx.imageSmoothingEnabled = false;
  gx.restore();

  // 5. and finally the warm part of that light, added rather than subtracted
  gx.save();
  gx.globalCompositeOperation = "lighter";
  for (i = 0; i < roofs.length; i++) {
    var ro3 = roofs[i], open3 = clamp(1 - ro3.a, 0, 1);
    if (open3 < 0.2) continue;
    if (ro3.x > x1 || ro3.x + ro3.w < x0 || ro3.y > y1 || ro3.y + ro3.h < y0) continue;
    for (j = 0; j < doors.length; j++) {
      if (distToRect(ro3, doors[j].x, doors[j].y) > 10) continue;
      var q = doorIn(doors[j], 26);
      warmDisc(q.x, q.y, 62, 0.10 * open3, "rgba(255,226,168,$A)");
    }
    for (j = 0; j < ro3.win.length; j++) {
      var w3 = ro3.win[j];
      warmDisc(w3.x + w3.dx * 24, w3.y + w3.dy * 24, 44, 0.07 * open3, "rgba(255,238,196,$A)");
    }
    for (j = 0; j < ro3.lamp.length; j++) {
      warmDisc(ro3.lamp[j].x, ro3.lamp[j].y, 70, 0.06 * open3 * LS.lamp, "rgba(214,236,255,$A)");
    }
  }
  gx.restore();
}

// Fallback for a canvas that will not give us a second buffer: flat interior
// shading, straight onto the main context. Plainer, still reads as indoors.
function flatIndoors(x0, y0, x1, y1) {
  for (var i = 0; i < roofs.length; i++) {
    var ro = roofs[i], open = clamp(1 - ro.a, 0, 1);
    if (open < 0.03) continue;
    if (ro.x > x1 || ro.x + ro.w < x0 || ro.y > y1 || ro.y + ro.h < y0) continue;
    gx.fillStyle = "rgba(10,14,22," + (LS.room * 0.8 * open) + ")";
    gx.fillRect(ro.x, ro.y, ro.w, ro.h);
    gx.fillStyle = "rgba(10,14,22," + (0.2 * open) + ")";
    gx.fillRect(ro.x, ro.y, ro.w, 22); gx.fillRect(ro.x, ro.y, 22, ro.h);
  }
}

var slist = [];
function drawEntities() {
  var i, x0 = cam.x - 80, y0 = cam.y - 80, x1 = cam.x + VW + 80, y1 = cam.y + VH + 80;
  slist.length = 0;
  for (i = 0; i < props.length; i++) {
    var p = props[i];
    if (p.x > x1 || p.x + p.w < x0 || p.y > y1 || p.y + p.h + 14 < y0) continue;
    slist.push({ y: p.y + p.h, t: 0, o: p });
  }
  for (i = 0; i < shells.length; i++) slist.push({ y: shells[i].y, t: 1, o: shells[i] });
  for (i = 0; i < drops.length; i++) slist.push({ y: drops[i].y + 8, t: 2, o: drops[i] });
  for (i = 0; i < barrels.length; i++) slist.push({ y: barrels[i].y + 8, t: 3, o: barrels[i] });
  for (i = 0; i < turrets.length; i++) slist.push({ y: turrets[i].y + 12, t: 4, o: turrets[i] });
  for (i = 0; i < chests.length; i++) {
    var ch = chests[i];
    if (ch.x + 40 < x0 || ch.x - 40 > x1 || ch.y + 40 < y0 || ch.y - 40 > y1) continue;
    slist.push({ y: ch.y + 10, t: 7, o: ch });
  }
  for (i = 0; i < foes.length; i++) slist.push({ y: foes[i].y + foes[i].r * 0.8, t: 5, o: foes[i] });
  if (P && state !== "dead") slist.push({ y: P.y + P.body * 0.8, t: 6, o: P });
  slist.sort(function (a, b) { return a.y - b.y; });

  for (i = 0; i < slist.length; i++) {
    var it = slist[i], o = it.o;
    if (it.t === 0) { drawProp(o); continue; }
    if (it.t === 1) {
      gx.fillStyle = "rgba(217,182,79," + (1 - o.t / o.life) + ")";
      gx.save(); gx.translate(o.x, o.y); gx.rotate(o.a); gx.fillRect(-2, -1, 4, 2); gx.restore();
      continue;
    }
    if (it.t === 2) {
      var nm = o.kind === "med" ? "medkit" : o.kind === "kit" ? "turret" : "crate";
      shadowOval(o.x + 2, o.y + 8, 9, 4, 0.3);
      spr(nm, o.x, o.y + Math.sin(timeNow * 5 + o.a) * 1.5, 19, null, o.t > 12 && (o.t * 6) % 2 > 1, 0);
      continue;
    }
    if (it.t === 3) { drum3d(o.x, o.y, o.r, o.hp <= 0 ? 1 : Math.max(0, 1 - o.hp / 3)); continue; }
    if (it.t === 4) {
      gx.save(); gx.translate(o.x, o.y); gx.rotate(o.a + Math.PI / 2);
      gx.fillStyle = "#0f1319"; gx.fillRect(-5, -20, 10, 4);
      gx.fillStyle = "#39424e"; gx.fillRect(-3, -22, 6, 16);
      gx.fillStyle = "rgba(255,255,255,.18)"; gx.fillRect(-3, -22, 6, 3);
      gx.restore();
      shadowOval(o.x + 3, o.y + 10, 14, 6, 0.35);
      spr("turret", o.x, o.y, 28, null, o.flash > 0, 0);
      gx.fillStyle = "rgba(0,0,0,.6)"; gx.fillRect(o.x - 12, o.y + 17, 24, 3);
      gx.fillStyle = "#4fd6c8"; gx.fillRect(o.x - 12, o.y + 17, 24 * clamp(o.hp / o.max, 0, 1), 3);
      continue;
    }
    // supply caches draw themselves (they are the only thing in the world that
    // has a state the player is mid-way through, and it wants its own ring)
    if (it.t === 7) { drawCache(o); continue; }
    if (it.t === 5) {
      var e = o, lit = e.flash > 0 || (e.burn > 0 && (timeNow * 20) % 2 > 1);
      shadowOval(e.x + 2, e.y + e.r * 0.75, e.r * 0.95, e.r * 0.45, 0.36);
      if (e.elite) {
        // elite halo as 8 grid-tick pixels chasing a circle - reads on the
        // pixel grid, unlike a soft vector ring which just smears at low res
        var ep = 0.55 + 0.25 * Math.sin(timeNow * 5), er = e.r + 5;
        var esz = Math.max(1, Math.round(2 * SC)) / SC;
        gx.fillStyle = "rgba(255,214,120," + ep + ")";
        for (var eq = 0; eq < 8; eq++) {
          var ea = eq * TAU / 8 + timeNow * 0.7;
          gx.fillRect(qpx(e.x + Math.cos(ea) * er - 1), qpx(e.y + Math.sin(ea) * er - 1), esz, esz);
        }
      }
      if (e.coveredBy && !e.coveredBy.gone && e.coveredBy.hp > 0) {
        // Someone is standing in front of this one. Three plate-coloured ticks laid
        // over its head in a shallow roof say so at a glance, and the roof is the
        // right glyph: it is being sheltered. It sits above the health bar rather
        // than beside it, because the bar is already doing a job. A link line back
        // to the shield was tried first and read as a laser sight - the pair is
        // obvious from who is standing where, and this is the one bit you need.
        var csz = Math.max(1, Math.round(3 * SC)) / SC;
        gx.fillStyle = "#aebbc9";
        for (var cq = 0; cq < 3; cq++) {
          gx.fillRect(qpx(e.x + (cq - 1) * (csz * 2) - csz / 2), qpx(e.y - e.r - 20 - (cq === 1 ? csz : 0)), csz, csz);
        }
      }
      if (e.kind === "shield" && e.protect && !e.protect.gone && e.protect.hp > 0) {
        // On post: five ticks of plate light fanned across the face it is pointing
        // at you, brighter and wider when its boots are planted (e.hold) than when it
        // is still walking there. A shield that has found its gun is a different
        // fight from a shield that is still wandering, and you should be able to tell
        // which one you are looking at before you spend a magazine on it. Sizes are
        // whole backing-store pixels and every position goes through qpx, same idiom
        // as the elite halo and the medic's mark: a soft arc smears away at this
        // resolution, and the first version of this at r+3 sat exactly on the body's
        // own dark outline and disappeared into it.
        var psz = Math.max(1, Math.round(3 * SC)) / SC;
        gx.fillStyle = e.pairFlash > 0 ? "#eef4fb" : e.hold ? "#dfe8f2" : "rgba(174,187,201,.6)";
        var pfan = e.hold ? 1.05 : 0.75;
        for (var pq = 0; pq < 5; pq++) {
          var pa2 = e.a - pfan + pq * pfan / 2;
          gx.fillRect(qpx(e.x + Math.cos(pa2) * (e.r + 8) - psz / 2), qpx(e.y + Math.sin(pa2) * (e.r + 8) - psz / 2), psz, psz);
        }
      }
      if (e.mended > 0) {
        // Four green grid ticks framing whoever the medic just worked on - same
        // idiom as the elite halo, because a soft ring smears away at this
        // resolution. Stepping the alpha rather than fading it keeps it pixel-clean.
        var msz = Math.max(1, Math.round(2 * SC)) / SC;
        gx.fillStyle = "rgba(126,240,180," + (e.mended > 0.75 ? 1 : e.mended > 0.45 ? 0.8 : 0.45) + ")";
        for (var mp = 0; mp < 4; mp++) {
          var mg = mp * TAU / 4 + 0.785 + timeNow * 0.6;
          gx.fillRect(qpx(e.x + Math.cos(mg) * (e.r + 4) - 1), qpx(e.y + Math.sin(mg) * (e.r + 4) - 1), msz, msz);
        }
      }
      var ef = frameOf(e, e.moving);
      // same two-beat bob as the player: rise on the pass step, settle on the stomp
      var ebob = (ef === 1 || ef === 3) ? -0.7 : (ef === 2 ? 0.7 : 0);
      // Bodies stay UPRIGHT - head always up - and merely turn their back shoulder
      // to the direction they are dealing with. Spinning the whole sprite put every
      // head sideways whenever a hostile shot at you from above or below, which read
      // as a broken sprite, not as a hostile aiming. The aim itself is told by the
      // muzzle flash, the tracer and the bullets.
      spr(e.spr, e.x, e.y + (e.moving ? ebob : 0),
        e.r * 2.5, e.kind === "spinner" ? timeNow * 2 : null, lit, ef, Math.cos(e.a) < 0);
      // a dark rim either way: the sprite still reads on a sunlit street and
      // still reads once the lighting pass has dropped the room two stops
      gx.strokeStyle = "rgba(6,10,16,.5)"; gx.lineWidth = 2; gx.beginPath();
      gx.arc(e.x, e.y, e.r + 1, 0, TAU); gx.stroke();
      if (e.hpMax > 5 && e.hp < e.hpMax) {
        var bw = e.r * 2;
        gx.fillStyle = "rgba(0,0,0,.6)"; gx.fillRect(e.x - bw / 2, e.y - e.r - 10, bw, 3);
        // a bar that went BACK UP is the strongest tell of all: green while the
        // medic's mark is on them, their own colour the rest of the time
        gx.fillStyle = e.mended > 0 ? "#7ef0b4" : e.col;
        gx.fillRect(e.x - bw / 2, e.y - e.r - 10, bw * clamp(e.hp / e.hpMax, 0, 1), 3);
      }
      continue;
    }
    // the player
    // dash after-images as snapped pixel squares, not soft circles: a pixel
    // echo should look like the sprite stuttering, not like frosted glass
    var tsz = Math.max(2, Math.round(P.body * 1.3 * SC)) / SC;
    for (var tr = 0; tr < P.trail.length; tr++) {
      var p2 = P.trail[tr];
      gx.globalAlpha = clamp(p2.t / 0.2, 0, 1) * 0.4;
      gx.fillStyle = "#aebbc9"; gx.fillRect(qpx(p2.x - tsz / 2), qpx(p2.y - tsz / 2), tsz, tsz);
    }
    gx.globalAlpha = 1;
    shadowOval(P.x + 2, P.y + P.body * 0.8, P.body * 1.05, P.body * 0.5, 0.4);
    var pf = frameOf(P, P.moving);
    // two-beat bob so the step reads even when the frame freezes. The body stays
    // UPRIGHT whatever way the boots point (see the note on the hostile sprites
    // above): P.face only decides which way round the sprite is, and the gun arm
    // under this aims at P.a, so nothing is lost by not turning the head.
    var pbob = (pf === 1 || pf === 3) ? -0.9 : (pf === 2 ? 0.9 : 0);
    spr("player", P.x, P.y + (P.moving ? pbob : 0), P.body * 2.6, null, P.hurt > 0.1, pf, Math.cos(P.face) < 0);
    // ---- "which one is me" ------------------------------------------------
    // The single most important pixel budget in the game: finding yourself for
    // half a second in a bullet-hell costs you a wave. What marks you is the art:
    // the only tan skin and olive shirt on the block under a pale head, with a gun
    // arm and a muzzle flash on top - plus the three gameplay rings further down,
    // which are no longer circles. A pass of mine here used to add a fourth mark,
    // eight light ticks in an ellipse around the boots; deleted, because the HUD
    // already reads DASH READY, the shadowOval above already grounds the body, and
    // a ring of dots round a figure reads as an RTS selection circle rather than
    // as a person standing on a street.
    // ---- gun arm ---------------------------------------------------------
    // Drawn over the body and aims at P.a whatever way the body faces: twin-
    // stick in a single sprite pass. Recoil slides it back, one frame of blocky
    // muzzle flash on top, dark outline under so it reads on sunlit asphalt.
    var pg = gun(), ga = P.a + (P.moving ? 0 : Math.sin(timeNow * 1.8) * 0.02), plen = (GUN_LEN[P.guns[P.gi]] || 9);
    var gid = P.guns[P.gi], rec = P.kick * 2.2;
    gx.save(); gx.translate(P.x, P.y); gx.rotate(ga);
    // One silhouette per gun, all from blocky rects so they land on the pixel
    // grid: the .357 shows a cylinder, the shotgun twin barrels, the AK an
    // outboard mag, the deer rifle a slim barrel + scope block, the pot
    // launcher a fat clay bomb, the flamethrower a shrouded nozzle with a
    // live pilot light, and the blades actually look like blades.
    gx.fillStyle = "#0b0f14";
    if (gid === "knife" || gid === "dagger") {
      gx.fillRect(0, -2.5, 6, 5);                                // grip
      gx.fillRect(4, -2, plen - 3, 4);                           // blade
    } else {
      gx.fillRect(1, -2.5, plen + 3, 5);
      if (gid === "gun" || gid === "sawn") gx.fillRect(1, -3.5, plen + 2, 2);       // over-under
      if (gid === "pot") gx.fillRect(1, -3.5, plen + 2, 7);                         // bomb bulb
      if (gid === "flam") gx.fillRect(1, -3.5, plen - 3, 7);                        // wide shroud
    }
    gx.fillStyle = "#39424e";
    gx.fillRect(2, -1.5, plen - rec, gid === "bolt" ? 2 : 3);
    gx.fillStyle = "#69758a";
    gx.fillRect(2, -1.5, Math.max(2, plen - 3 - rec), 1);
    if (gid === "rev" || gid === "flint") {
      gx.fillStyle = "#69758a"; gx.fillRect(4 - rec, -2, 3, 4);                     // cylinder
    } else if (gid === "smg" || gid === "ak" || gid === "lmg") {
      gx.fillStyle = "#39424e"; gx.fillRect(3 + plen * 0.35, 1, gid === "lmg" ? 5 : 3, 3);  // magazine
      gx.fillStyle = "#0b0f14"; gx.fillRect(4 + plen * 0.35, 1, gid === "lmg" ? 3 : 1, 3);
    } else if (gid === "bolt") {
      gx.fillStyle = "#69758a"; gx.fillRect(5 - rec, -3, 4, 2);                     // scope block
      gx.fillStyle = "#c9c2a8"; gx.fillRect(8 - rec, -3, 1, 2);                     // lens glint
    } else if (gid === "gun") {
      gx.fillStyle = "#8a6f28"; gx.fillRect(3, -1, Math.max(2, plen * 0.45 - rec), 2);       // wood forend
    } else if (gid === "pot") {
      gx.fillStyle = "#a45a2a"; gx.fillRect(plen - 3 - rec, -2, 4, 4);              // clay pot
    } else if (gid === "flam") {
      gx.fillStyle = "#8a3a30"; gx.fillRect(plen - 2 - rec, -2, 4, 4);              // nozzle
      gx.fillStyle = (timeNow * 14) % 2 > 1 ? "#ff8a4c" : "#ffd678";                // pilot light, always on
      gx.fillRect(plen + 2 - rec, -1, 1, 2);
    }
    gx.fillStyle = pg.melee ? "#eef4fb" : "#aebbc9";
    gx.fillRect(plen - 1 - rec, -1, 3, pg.melee ? 3 : 2);                           // blade tip / muzzle brake
    if (P.kick > 0.9 && !pg.melee) {
      gx.fillStyle = "#ffd678"; gx.fillRect(plen + 2 - rec, -2, 5, 4);
      gx.fillStyle = "#fff2c8"; gx.fillRect(plen + 3 - rec, -1, 3, 2);
    }
    gx.restore();
    if (P.swing > 0) {
      var g0 = gun();
      gx.save(); gx.globalAlpha = P.swing / 0.16 * 0.7;
      gx.strokeStyle = "#eef4fb"; gx.lineWidth = 3;
      gx.beginPath(); gx.arc(P.x, P.y, g0.range, P.a - g0.arc / 2, P.a + g0.arc / 2); gx.stroke();
      gx.restore();
    }
    // ---- the three rings you wear, moved onto the pixel grid --------------
    // All three of these radii are GAMEPLAY facts and have to be readable: grazeR
    // (how close a round must miss you to score), the armour plates, and the
    // 4.5-unit core that is what actually gets hit while the sprite reads 11. They
    // used to be three smooth vector arcs - 1 px and 2 px strokes at radii 14-32,
    // 16 and 4.5, the innermost one FILLED #ff5d5d across the chest. That stack is
    // the one thing pixel art cannot survive: AA hairlines fighting the sprite's
    // own baked outline, and a red disc on the belly is why four sessions of
    // screenshots kept getting described as "a dark hole with something red in
    // it". Same information, house idiom - grid-snapped blocks, dim outside, hot
    // nearest the body, the same 3px alphabet as the elite halo and the pair ticks.
    gx.fillStyle = "#eef4fb"; gx.globalAlpha = 0.24;
    var gsz = Math.max(1, Math.round(2 * SC)) / SC, ggr = grazeR();
    for (var rg = 0; rg < 4; rg++) {                       // 4 diagonals, never the head
      var ra = rg * TAU / 4 + Math.PI / 4;
      gx.fillRect(qpx(P.x + Math.cos(ra) * ggr - gsz / 2), qpx(P.y + Math.sin(ra) * ggr - gsz / 2), gsz, gsz);
    }
    if (P.plates > 0) {                                    // plates ride the shoulders
      gx.globalAlpha = 0.6 + 0.2 * Math.sin(timeNow * 6); gx.fillStyle = "#aebbc9";
      var psz = Math.max(1, Math.round(3 * SC)) / SC;
      for (var pl = 0; pl < P.plates && pl < 3; pl++) {
        var pa = -Math.PI / 2 + (pl - 1) * 0.7;
        gx.fillRect(qpx(P.x + Math.cos(pa) * (P.body + 4) - psz / 2),
          qpx(P.y + Math.sin(pa) * (P.body + 4) - psz / 2), psz, psz);
      }
    }
    // Core: hollow, so it reads as a sight laid over you instead of a target
    // painted on you, and built as four corner brackets so the middle stays clear
    // (the sprite has a white pixel on the chest and a filled box was eating it)
    // and every edge is a whole backing-store pixel. White for the frame you hit.
    gx.globalAlpha = 1; gx.fillStyle = hitFlash > 0 ? "#ffffff" : "#ff5d5d";
    var cbx = Math.round(P.x * SC), cby = Math.round(P.y * SC);
    var cn = Math.max(2, Math.round(P.core * SC)), cl = Math.max(1, Math.round(cn * 0.7));
    var cw = Math.max(1, Math.round(0.8 * SC)) / SC;
    for (var cc = 0; cc < 4; cc++) {
      var sx = cc & 1 ? 1 : -1, sy = cc & 2 ? 1 : -1;
      gx.fillRect((cbx + sx * cn - (sx < 0 ? cl : 0)) / SC, (cby + sy * cn - (sy < 0 ? cw : 0)) / SC, cl / SC, cw);
      gx.fillRect((cbx + sx * cn - (sx < 0 ? cw : 0)) / SC, (cby + sy * cn - (sy < 0 ? cl : 0)) / SC, cw, cl / SC);
    }
  }
}

function drawFx() {
  var i;
  // mortar telegraphs
  for (i = 0; i < mortars.length; i++) {
    var mm = mortars[i], pr = mm.t / mm.life;
    gx.save();
    gx.globalAlpha = 0.25 + pr * 0.45;
    gx.fillStyle = "#3a1a12"; gx.beginPath(); gx.arc(mm.x, mm.y, mm.r * pr, 0, TAU); gx.fill();
    gx.globalAlpha = 0.85;
    gx.strokeStyle = "#ff8a4c"; gx.lineWidth = 2;
    gx.beginPath(); gx.arc(mm.x, mm.y, mm.r, 0, TAU); gx.stroke();
    gx.beginPath(); gx.moveTo(mm.x - 8, mm.y); gx.lineTo(mm.x + 8, mm.y);
    gx.moveTo(mm.x, mm.y - 8); gx.lineTo(mm.x, mm.y + 8); gx.stroke();
    gx.restore();
  }
  // telegraphs under entities
  for (i = 0; i < foes.length; i++) {
    var fe2 = foes[i];
    if (fe2.tele > 0 && fe2.kind === "sniper") {
      gx.save(); gx.globalAlpha = 0.35 + 0.3 * Math.sin(timeNow * 22);
      gx.strokeStyle = "#c77dff"; gx.lineWidth = 2;
      gx.beginPath(); gx.moveTo(fe2.x, fe2.y);
      gx.lineTo(fe2.x + Math.cos(fe2.snipeA) * 900, fe2.y + Math.sin(fe2.snipeA) * 900);
      gx.stroke(); gx.restore();
    } else if (fe2.tele > 0) {
      gx.save(); gx.globalAlpha = 0.5;
      gx.strokeStyle = fe2.col; gx.lineWidth = 2;
      gx.beginPath(); gx.arc(fe2.x, fe2.y, fe2.r + 6 + Math.sin(timeNow * 18) * 2, 0, TAU); gx.stroke();
      gx.restore();
    }
  }
  // incoming fire stays on top of everything: bullet-hell readability first.
  // On a sunlit street a coloured dot is not enough, so every round carries a
  // dark backing ring before its own colour goes down.
  for (i = 0; i < ebul.length; i++) {
    var b2 = ebul[i];
    if (!onScreen(b2.x, b2.y, 40)) continue;
    gx.save();
    gx.fillStyle = "rgba(8,12,18,.55)";
    gx.beginPath(); gx.arc(b2.x, b2.y, b2.r + 3.2, 0, TAU); gx.fill();
    gx.globalAlpha = 0.4; gx.fillStyle = b2.col;
    gx.beginPath(); gx.arc(b2.x, b2.y, b2.r + 4, 0, TAU); gx.fill();
    gx.globalAlpha = 1;
    if (b2.kind === "snipe") {
      gx.strokeStyle = b2.col; gx.lineWidth = 3;
      gx.beginPath(); gx.moveTo(b2.x, b2.y); gx.lineTo(b2.x - b2.vx * 0.02, b2.y - b2.vy * 0.02); gx.stroke();
      gx.fillStyle = "#fff"; gx.beginPath(); gx.arc(b2.x, b2.y, 2.4, 0, TAU); gx.fill();
    } else {
      gx.fillStyle = b2.col; gx.beginPath(); gx.arc(b2.x, b2.y, b2.r, 0, TAU); gx.fill();
      gx.fillStyle = "#fff"; gx.beginPath(); gx.arc(b2.x, b2.y, b2.r * 0.45, 0, TAU); gx.fill();
    }
    gx.restore();
  }
  gx.lineCap = "round";
  for (i = 0; i < bullets.length; i++) {
    var ob = bullets[i];
    gx.strokeStyle = ob.col; gx.lineWidth = ob.r * 1.5;
    gx.beginPath(); gx.moveTo(ob.x, ob.y); gx.lineTo(ob.x - ob.vx * 0.012, ob.y - ob.vy * 0.012); gx.stroke();
  }
  for (i = 0; i < parts.length; i++) {
    var pa2 = parts[i];
    gx.globalAlpha = clamp(1 - pa2.t / pa2.life, 0, 1);
    gx.fillStyle = pa2.col;
    gx.beginPath(); gx.arc(pa2.x, pa2.y, pa2.r, 0, TAU); gx.fill();
  }
  for (i = 0; i < ripples.length; i++) {
    var rp = ripples[i], rpA = 1 - rp.t / rp.life;
    gx.save(); gx.globalAlpha = rpA * 0.7;
    gx.strokeStyle = rp.col; gx.lineWidth = 3;
    gx.beginPath(); gx.arc(rp.x, rp.y, rp.r * (0.35 + 0.65 * (1 - rpA)), 0, TAU); gx.stroke();
    gx.restore();
  }
  // pickups / purchases: a line of text that rises from wherever it happened
  for (i = 0; i < floaters.length; i++) {
    var fv = floaters[i];
    if (!onScreen(fv.x, fv.y, 60)) continue;
    gx.globalAlpha = clamp(1 - fv.t / fv.life, 0, 1);
    text(fv.txt, fv.x, fv.y, 12, fv.col, "center");
  }
  gx.globalAlpha = 1;
}

function drawWorld() {
  drawGround();
  // the shop terminal and turret pad live indoors, so they are painted with the
  // props they belong to
  shadowOval(shopAt.x + 3, shopAt.y + 12, 16, 7, 0.35);
  spr("shopk", shopAt.x, shopAt.y, 32, null, false, 0);
  shadowOval(padAt.x + 3, padAt.y + 14, 24, 10, 0.3);
  spr("pad", padAt.x, padAt.y, 48, null, false, 0);
  drawWalls();
  drawEntities();
  drawRoofs();
  drawLighting();
  drawFx();
  // waypoints that show through roofs so the shop + pad are findable
  gx.save(); gx.globalAlpha = 0.9;
  text("E", shopAt.x, shopAt.y - 34, 13, "#d9b64f", "center");
  text("F", padAt.x, padAt.y - 34, 13, "#4fd6c8", "center");
  gx.restore();
}

// ---- frame --------------------------------------------------------------
function draw() {
  updateCam(false);
  gx.setTransform(1, 0, 0, 1, 0, 0);
  gx.imageSmoothingEnabled = false;
  gx.fillStyle = "#0d1015"; gx.fillRect(0, 0, cv.width, cv.height);
  gx.setTransform(SC, 0, 0, SC, 0, 0);

  var sx = shake ? rnd(-shake, shake) * 0.35 : 0, sy = shake ? rnd(-shake, shake) * 0.35 : 0;
  gx.save();
  gx.translate(-qpx(cam.x - sx), -qpx(cam.y - sy));   // camera snaps to the pixel grid
  drawWorld();
  gx.restore();

  // ---- daylight --------------------------------------------------------
  // The sky is the biggest light source in the frame: a cool wash added over
  // the whole street, plus the warm of the sun itself coming in from one
  // corner. Added rather than multiplied, so it lifts the shadows instead of
  // milking the whole picture. Drawn before the HUD so the UI stays crisp.
  gx.save();
  gx.globalCompositeOperation = "lighter";
  gx.fillStyle = LS.amb;
  gx.fillRect(0, 0, VW, VH);
  var sg = null;
  try {
    sg = gx.createLinearGradient(0, 0, VW * 0.75, VH);
    if (!sg || !sg.addColorStop) sg = null;
    else { sg.addColorStop(0, LS.sun); sg.addColorStop(1, "rgba(0,0,0,0)"); }
  } catch (e) { sg = null; }
  if (sg) { gx.fillStyle = sg; gx.fillRect(0, 0, VW, VH); }
  gx.restore();

  // everything below is screen space. the menu and the win screen keep it to
  // themselves - an overlay reads far better without a live HUD behind it
  if (state !== "menu" && state !== "won") {
    drawOffscreen();
    drawHUD();
    drawMinimap();
  }
  if (shopOpen) drawShop();
  if (state === "upgrade") drawCards();
  drawBossBar();
  drawReticle();
  if (state !== "menu") drawKeys();
  drawOverlays();

  if (hitFlash > 0) {
    var hf = clamp(hitFlash * 2.0, 0, 1);
    gx.fillStyle = "rgba(210,70,60," + (hf * 0.32) + ")"; gx.fillRect(0, 0, VW, VH);
  }
  var lowhp = P && P.hp > 0 && P.hp < 40 ? (1 - P.hp / 40) : 0;
  if (lowhp > 0 || state === "dead") {
    var a2 = Math.max(lowhp, state === "dead" ? 1 : 0) * (0.5 + 0.2 * Math.sin(timeNow * 5));
    gx.fillStyle = "rgba(120,20,20," + (a2 * 0.35) + ")"; gx.fillRect(0, 0, VW, VH);
  }
  // a light falloff at the edges of the viewport: enough to hold the eye in the
  // middle of a bright street without turning the block back night. Only while
  // you are actually on it - an overlay puts its own frame up.
  if (state === "play" || state === "dead") {
    try {
      var vg = gx.createRadialGradient(VW / 2, VH / 2, VW * 0.34, VW / 2, VH / 2, VW * 0.8);
      if (vg && vg.addColorStop) {
        vg.addColorStop(0, "rgba(0,0,0,0)");
        vg.addColorStop(1, "rgba(6,10,16,0.20)");
        gx.fillStyle = vg; gx.fillRect(0, 0, VW, VH);
      }
    } catch (e) {}
  }
  gx.textAlign = "left";
}

// ---- off-screen pointers ------------------------------------------------
function edgePoint(x, y, pad) {
  var cx = VW / 2, cy = VH / 2, dx = x - cam.x - cx, dy = y - cam.y - cy;
  var k = Math.min((cx - pad) / Math.abs(dx || 0.001), (cy - pad) / Math.abs(dy || 0.001));
  return { x: cx + dx * k, y: cy + dy * k, a: Math.atan2(dy, dx) };
}
function drawOffscreen() {
  var i, n = 0;
  for (i = 0; i < foes.length && n < 14; i++) {
    var e = foes[i];
    if (onScreen(e.x, e.y, 10)) continue;
    var p = edgePoint(e.x, e.y, 26);
    gx.save(); gx.translate(p.x, p.y); gx.rotate(p.a);
    gx.globalAlpha = e.elite ? 0.9 : 0.5;
    gx.fillStyle = e.col;
    gx.beginPath(); gx.moveTo(8, 0); gx.lineTo(-5, -5); gx.lineTo(-5, 5); gx.closePath(); gx.fill();
    gx.restore(); n++;
  }
  gx.globalAlpha = 1;
  var marks = [{ o: shopAt, c: "#d9b64f", t: "$" }, { o: padAt, c: "#4fd6c8", t: "T" }];

function drawReticle() {
  if (touch || !P) return;                                     // touch uses auto-aim, no cursor
  // snapped to whole backing-store px so the crosshair arms are crisp, and the
  // tick snaps too - a reticle between pixels reads as a blurry smudge
  var mx = qpx(clamp(mouse.x - cam.x, 10, VW - 10)), my = qpx(clamp(mouse.y - cam.y, 10, VH - 10));
  var px = P.x - cam.x, py = P.y - cam.y;
  var id = P.guns[P.gi], g = GUNS[id];
  var dry = !g.melee && (P.mag[id] || 0) === 0 && P.reloading <= 0;
  var col = P.reloading > 0 ? "#d9b64f" : dry ? "#c04a35" : "#8dffbe";
  var sp = 7 + (g.spread || 0) * 40 + (P.dashT > 0 ? 4 : 0);
  gx.save();
  gx.globalAlpha = 0.14; gx.strokeStyle = col; gx.lineWidth = 1;
  gx.beginPath();
  gx.moveTo(px + Math.cos(P.a) * (P.body + 7), py + Math.sin(P.a) * (P.body + 7));
  gx.lineTo(mx, my); gx.stroke();
  gx.globalAlpha = 0.95; gx.strokeStyle = col; gx.lineWidth = 2;
  gx.beginPath(); gx.arc(mx, my, 9, 0, TAU); gx.stroke();
  gx.beginPath();
  gx.moveTo(mx - sp - 7, my); gx.lineTo(mx - sp, my);
  gx.moveTo(mx + sp, my); gx.lineTo(mx + sp + 7, my);
  gx.moveTo(mx, my - sp - 7); gx.lineTo(mx, my - sp);
  gx.moveTo(mx, my + sp); gx.lineTo(mx, my + sp + 7);
  gx.stroke();
  gx.fillStyle = col; gx.beginPath(); gx.arc(mx, my, 1.6, 0, TAU); gx.fill();
  gx.restore();
  if (dry) text("DRY - R", mx, my + 28, 11, "#c04a35", "center");
}

// ============================================================ menu / overlays
// [Subsystem 19b] The main menu is a selector, not a wall of text: one accent
// (difficulty) and one block (map) per run. Both are coloured by the accent you
// have picked, both remember what you have earned, and both refuse to let you
// walk into a fight you have not unlocked yet.
function modeStep(d) {
  var n = MODES.length, i = modeIdx;
  for (var k = 0; k < n; k++) {
    i = (i + d + n) % n;
    if (modeUnlocked(i)) { if (i !== modeIdx) { modeIdx = i; tone(520, 0.05, "square", 0.03, 1.35); } return; }
  }
}
function mapStep(d) {
  var n = MAPS.length, i = mapIdx;
  for (var k = 0; k < n; k++) {
    i = (i + d + n) % n;
    if (mapUnlocked(i)) { if (i !== mapIdx) { mapIdx = i; pickMap(i); } return; }
  }
}
function menuHit(x, y, w, h, ok, i, pick) {
  menuHits.push({ x: x, y: y, w: w, h: h, f: function () {
    if (!ok) { tone(140, 0.09, "square", 0.04, 0.6); return; }        // locked: say so in a tone
    pick(i);
  } });
}
function pickMode(i) { modeIdx = i; tone(520, 0.05, "square", 0.03, 1.35); }
function pickMap(i) {
  mapIdx = i; tone(420, 0.06, "square", 0.03, 1.3);
  reset();                                               // the block behind the menu is the one you picked
}

// One selector row. A wide screen shows every option; a narrow one collapses to
// the current option with a hit zone either side of it. Either way the accent
// colour of the run is what you see in the frame.
function menuRow(y, h, label, items, sel, accOf, okOf, subOf, onPick, onStep) {
  var x0 = Math.max(24, VW * 0.06), w = VW - x0 * 2, n = items.length, gap = 8, i;
  text(label, x0, y + 14, 12, "#5d6b7e");
  var lab = 84, sx = x0 + lab, cw = Math.floor((w - lab - gap * (n - 1)) / n);
  if (cw >= 76) {
    for (i = 0; i < n; i++) {
      var bx = sx + i * (cw + gap), ok = okOf(i), on = i === sel;
      gx.fillStyle = on ? "rgba(255,255,255,.09)" : "rgba(255,255,255,.03)";
      gx.fillRect(bx, y, cw, h);
      gx.strokeStyle = on ? accOf(items[i]) : ok ? "rgba(120,150,190,.28)" : "rgba(120,150,190,.1)";
      gx.lineWidth = on ? 2 : 1; gx.strokeRect(bx + .5, y + .5, cw - 1, h - 1);
      if (on) { gx.fillStyle = accOf(items[i]); gx.fillRect(bx, y, cw, 3); }
      text(ok ? items[i].n : "LOCKED", bx + cw / 2, y + 20, 12, ok ? (on ? "#eef4fb" : "#9fb3c9") : "#4d596b", "center");
      text(subOf(items[i], i, ok), bx + cw / 2, y + 37, 10, ok ? "#7b8ca6" : "#4d596b", "center");
      menuHit(bx, y, cw, h, ok, i, onPick);
    }
  } else {
    var aw = 34, cwx = Math.min(w - lab - aw * 2 - 16, 300), bx2 = sx + aw + 8;
    for (i = 0; i < 2; i++) {
      var ax = i === 0 ? sx : bx2 + cwx + 8, on2 = okOf((sel + (i === 0 ? -1 : 1) + n) % n);
      gx.fillStyle = "rgba(255,255,255,.05)"; gx.fillRect(ax, y, aw, h);
      gx.strokeStyle = on2 ? "rgba(120,150,190,.35)" : "rgba(120,150,190,.1)";
      gx.lineWidth = 1; gx.strokeRect(ax + .5, y + .5, aw - 1, h - 1);
      text(i === 0 ? "\u25c0" : "\u25b6", ax + aw / 2, y + 22, 14, on2 ? "#cfd9e6" : "#3f4a5a", "center");
      (function (dir) { menuHits.push({ x: ax, y: y, w: aw, h: h, f: function () { onStep(dir); } }); })(i === 0 ? -1 : 1);
    }
    gx.fillStyle = "rgba(255,255,255,.05)"; gx.fillRect(bx2, y, cwx, h);
    gx.strokeStyle = accOf(items[sel]); gx.lineWidth = 2; gx.strokeRect(bx2 + .5, y + .5, cwx - 1, h - 1);
    text(items[sel].n, bx2 + cwx / 2, y + 20, 13, "#eef4fb", "center");
    text(subOf(items[sel], sel, true), bx2 + cwx / 2, y + 37, 10, "#7b8ca6", "center");
  }
}

function drawMenu() {
  menuHits.length = 0;
  var md = MODES[modeIdx], mp = MAPS[mapIdx], i;
  dim(0.84);
  // the accent paints the frame, so you can see the difficulty you picked with
  // the corner of your eye
  gx.fillStyle = md.acc; gx.globalAlpha = 0.55;
  gx.fillRect(0, 0, VW, 4); gx.fillRect(0, VH - 4, VW, 4);
  gx.globalAlpha = 0.10; gx.fillRect(0, 0, 4, VH); gx.fillRect(VW - 4, 0, 4, VH);
  gx.globalAlpha = 1;

  text("B L O C K O U T", VW / 2, 74, clamp(VW / 17, 30, 56), "#eef4fb", "center", md.acc);
  text("bullet-hell siege  ·  the camera follows you down the block", VW / 2, 100, 13, "#8fa2b8", "center");

  var rowH = 48, y = 124;
  menuRow(y, rowH, "MODE", MODES, modeIdx, function (m) { return m.acc; },
    function (k) { return modeUnlocked(k); },
    function (m, k, ok) { return ok ? (prog.clr[progKey(mapIdx, k)] ? "held here" : m.goal + " waves to hold") : "clear " + MODES[k - 1].n; },
    pickMode, modeStep);
  y += rowH + 22;
  menuRow(y, rowH, "BLOCK", MAPS, mapIdx, function () { return md.acc; },
    function (k) { return mapUnlocked(k); },
    function (m, k, ok) {
      if (!ok) return "hold " + MAPS[k - 1].n;
      var b = prog.best[progKey(k, modeIdx)];
      return b ? "best " + b : m.sub;
    },
    pickMap, mapStep);
  y += rowH + 18;

  // what this combination actually changes - all three knobs, out in the open
  var pw = Math.min(560, VW - 48), px = (VW - pw) / 2;
  panel(px, y, pw, 62, 0.9);
  gx.fillStyle = md.acc; gx.globalAlpha = 0.14; gx.fillRect(px, y, pw, 62); gx.globalAlpha = 1;
  text(md.n + "  ·  " + mp.n, px + 14, y + 22, 14, md.acc);
  text(md.d, px + 14, y + 40, 12, "#9fb3c9");
  text("foe damage \u00d7" + md.dmg.toFixed(2) + "   health \u00d7" + md.hp.toFixed(2) + "   speed \u00d7" + md.sp.toFixed(2) +
       "   block \u00d7" + mp.dmg.toFixed(2), px + 14, y + 56, 11, "#6d7e94");
  y += 76;

  var lines = [
    "WASD move   click fire   R reload   SHIFT dash   F turret   E shop",
    "1-9/0 weapons, Q or wheel cycles   TAB shop tabs   P pause   M mute   roofs lift as you go in",
    "graze bullets for pay   stall and they reinforce   UPGRADES COME OUT OF CRATES - stand close to pry one"
  ];
  for (i = 0; i < lines.length; i++) text(lines[i], VW / 2, y + i * 18, 12, "#7b8ca6", "center");
  text("A / D  mode        W / S  block", VW / 2, y + lines.length * 18 + 14, 13, "#5d6b7e", "center");
  text("SPACE or click to deploy", VW / 2, y + lines.length * 18 + 40, 19, "#69c07a", "center", "#2c5c38");
  if (best) text("best score " + best, VW / 2, y + lines.length * 18 + 62, 12, "#5d6b7e", "center");
}

function drawWon() {
  menuHits.length = 0;
  var md = MODES[modeIdx], mp = MAPS[mapIdx], i;
  dim(0.76);
  gx.fillStyle = md.acc; gx.globalAlpha = 0.6; gx.fillRect(0, 0, VW, 4); gx.globalAlpha = 1;
  text("BLOCK SECURED", VW / 2, 150, clamp(VW / 13, 32, 56), md.acc, "center", "#1b2833");
  text(mp.n + "  ·  " + md.n + "  ·  " + md.goal + " waves held", VW / 2, 186, 16, "#eef4fb", "center");
  text("score " + score + "    kills " + kills + "    credits $" + credits, VW / 2, 214, 18, "#cfd9e6", "center");
  var pb = prog.best[progKey(mapIdx, modeIdx)] || 0;
  text(score >= pb && score > 0 ? "BEST ON THIS BLOCK" : "best here " + pb, VW / 2, 240, 13,
    score >= pb && score > 0 ? "#d9b64f" : "#5d6b7e", "center");
  if (unlockedNew.length) {
    text("UNLOCKED", VW / 2, 282, 15, "#69c07a", "center");
    for (i = 0; i < unlockedNew.length; i++) text(unlockedNew[i], VW / 2, 306 + i * 22, 17, "#eef4fb", "center");
  } else {
    text("nothing new unlocked - you had already earned this", VW / 2, 292, 13, "#5d6b7e", "center");
  }
  var yy = Math.max(360, 340 + unlockedNew.length * 22);
  text("SPACE  —  push on: endless, no goal, they do not let up", VW / 2, yy, 17, "#8dffbe", "center", "#2c5c38");
  menuHits.push({ x: VW / 2 - 240, y: yy - 20, w: 480, h: 26, f: function () { endless = true; state = "play"; } });
  text("R  —  back to the menu", VW / 2, yy + 26, 14, "#8fa2b8", "center");
  menuHits.push({ x: VW / 2 - 160, y: yy + 6, w: 320, h: 22, f: function () { state = "menu"; reset(); } });
}

function drawOverlays() {
  if (state === "menu") { drawMenu(); return; }
  if (state === "won") { drawWon(); return; }
  menuHits.length = 0;
  if (state === "pause") {
    dim(0.66);
    text("PAUSED", VW / 2, VH / 2 - 12, 44, "#eef4fb", "center", MODES[modeIdx].acc);
    text(MAPS[mapIdx].n + "  ·  " + MODES[modeIdx].n + "   ·   P to resume", VW / 2, VH / 2 + 22, 15, "#8fa2b8", "center");
    return;
  }
  if (state === "dead") {
    dim(0.72);
    text("OVERRUN", VW / 2, 200, 60, "#c04a35", "center", "#5c1f18");
    text("score " + score + "    wave " + wave + "    kills " + kills, VW / 2, 250, 21, "#eef4fb", "center");
    text(MAPS[mapIdx].n + "  ·  " + MODES[modeIdx].n + "  ·  " + MODES[modeIdx].goal + " waves to hold", VW / 2, 276, 13, MODES[modeIdx].acc, "center");
    text(score >= best && score > 0 ? "NEW BEST" : "best " + best, VW / 2, 300, 15, score >= best && score > 0 ? "#d9b64f" : "#5d6b7e", "center");
    text("SPACE to redeploy on the same block   ·   R for the menu", VW / 2, 350, 17, "#69c07a", "center", "#2c5c38");
  }
}
// ============================================================ loop
// [Subsystem 20] Frame loop + crash reporter. Owns errLog, dbgEl.
// frame(ts) runs update+draw in a try/catch; logDbg prints to #dbg so a boot
// failure shows a stack instead of a grey screen. See SYSTEMS.md §20.
var last = 0;
function frame(ts){
  try{
    var dt = Math.min(0.033, (ts - last) / 1000 || 0.016);
    last = ts;
    dt_smooth = Math.min(1, dt * 12);
    muteT = Math.max(0, muteT - dt);
    shopBad = Math.max(0, shopBad - dt);
    if (state === "play" && !shopOpen) update(dt);
    else if (state === "dead") updateFx(dt);
    else timeNow += dt;
    draw();
  }catch(err){
    logDbg("[FRAME @" + (timeNow.toFixed(2)) + "] " + err.name + ": " + err.message + "\n  " + (err.stack || "").replace(/\n/g, "\n  "));
  }
  requestAnimationFrame(frame);
}
// Boot inside a guard: if any of this throws we still start the loop (so the
// window keeps repainting) and the crash reporter prints the reason.
try {
  refit();
  reset();
  state = "menu";
} catch (bootErr) {
  logDbg("[BOOT] " + bootErr.name + ": " + bootErr.message + "\n  " + (bootErr.stack || "").replace(/\n/g, "\n  "));
}
requestAnimationFrame(frame);

})();
</script>
